<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-mask-192.png">
<link rel="icon" href="icon-192.png">
<title>Смарт Солгрид ХХК</title>
<style>
:root{
  --bg:#E9ECE8; --surface:#fff; --ink:#1B2A33; --muted:#5E6B70;
  --line:#D5DBD5; --good:#2F6B4F; --bad:#B33A2B; --blue:#2A5F7A;
  --asset:#8A6A1F; --track:#DCE2DC;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  padding-top:env(safe-area-inset-top);
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:560px;margin:0 auto;padding:16px 16px 112px}
button{font-family:inherit}
input{
  width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:16px;outline:none;font-family:inherit
}
input:focus{border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px}
.hero{background:var(--ink);color:#fff;border-radius:14px;padding:18px 16px;margin-bottom:20px}
.pairs{display:flex;gap:14px;margin-top:12px}
.pair{flex:1;padding:10px 12px;border-radius:9px;background:#F2F5F1}
.hero .pair{background:rgba(255,255,255,.08)}
.plabel{font-size:11.5px;color:var(--muted);margin-bottom:3px;line-height:1.3}
.hero .plabel{color:rgba(255,255,255,.6)}
.pval{font-size:17px;font-weight:700;letter-spacing:-.01em}
.pos{color:var(--good)} .neg{color:var(--bad)}
.psub{font-size:12px;margin-top:5px;padding-top:5px;border-top:1px solid rgba(0,0,0,.07);line-height:1.35}
.hero .psub{border-top-color:rgba(255,255,255,.15)}
.psub .pl{color:var(--muted);display:block}
.hero .psub .pl{color:rgba(255,255,255,.55)}
.psub b{font-size:13.5px}
.hero .pos{color:#8FD3AE} .hero .neg{color:#F08A7A}
.meta{display:flex;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.hero .meta{border-top-color:rgba(255,255,255,.15)}
.mlabel{font-size:11.5px;color:var(--muted)} .hero .mlabel{color:rgba(255,255,255,.55)}
.mval{font-weight:600}
.jobcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;color:inherit;font-size:inherit}
.jobcard:active{background:#F7F9F6}
.jname{font-size:17px;font-weight:600}
.bar{height:5px;background:var(--track);border-radius:3px;margin:12px 0 8px;overflow:hidden}
.bar>i{display:block;height:100%}
.sub{font-size:12.5px;color:var(--muted);line-height:1.5}
.btn{padding:11px 16px;border-radius:8px;border:none;background:var(--ink);color:#fff;
  font-size:15px;font-weight:600;cursor:pointer;width:100%}
.btn.blue{background:var(--blue)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);width:auto}
.link{background:none;border:none;color:var(--muted);font-size:15px;padding:4px 0 14px;cursor:pointer}
.danger{background:none;border:none;color:var(--bad);font-size:14px;margin-top:20px;cursor:pointer}
.tabs{display:flex;background:#EDF0EC;border-radius:8px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;padding:8px 2px;border-radius:6px;border:none;background:transparent;color:var(--muted);
  font-size:13px;white-space:nowrap;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.row.exp{border-left:3px solid var(--bad)}
.row.inc{border-left:3px solid var(--blue)}
.row.asset{border-left:3px solid var(--asset)}
.rdesc{font-size:15px;font-weight:500}
.rdate{font-size:12px;color:var(--muted);margin-top:2px}
.ramt{font-weight:600;white-space:nowrap}
.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;background:#F4EEDC;
  color:var(--asset);font-size:11px;font-weight:600;vertical-align:1px}
.x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:4px 6px;
  min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.empty{background:var(--surface);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted);margin-bottom:14px}
.note{color:var(--muted);font-size:14px;padding:6px 2px}
.tools{display:flex;gap:8px;margin-top:26px;justify-content:center}
.tools button{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
.h2{display:flex;gap:8px;align-items:center;margin-top:4px}
.check{display:flex;align-items:center;gap:9px;margin:2px 0 12px;cursor:pointer;
  font-size:14.5px;color:var(--ink);user-select:none}
.check input{width:20px;height:20px;accent-color:var(--asset);flex:none}
.total{display:flex;justify-content:space-between;align-items:center;background:#F4EEDC;
  border-radius:10px;padding:13px 15px;margin-bottom:12px}
.total b{font-size:18px;color:var(--asset)}
.small{background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);
  font-size:13px;padding:8px 12px;cursor:pointer;white-space:nowrap;font-family:inherit}
.small.warn{color:var(--bad);border-color:#EBD2CE;background:none;margin-top:0;padding:8px 12px;font-size:13px;line-height:normal;border-radius:8px}
.jobtag{font-size:11.5px;color:var(--muted);margin-top:3px}
.off{opacity:.55}
.off .rdesc{text-decoration:line-through}
.secttl{font-size:13px;color:var(--muted);margin:22px 0 8px;font-weight:600}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px 6px 10px;margin-bottom:18px;overflow:hidden}
.chartscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chartscroll::-webkit-scrollbar{display:none}
.chartttl{font-size:13px;color:var(--muted);font-weight:600;padding:0 10px 2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:8px 10px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;
  display:inline-flex;align-items:center;min-height:38px;padding:0 13px;font-size:13.5px;cursor:pointer;font-family:inherit}
.chip .cd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;flex:none}
.chip.on .cd{box-shadow:0 0 0 1.5px #fff}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.inf{background:#F2F5F1;border-radius:10px;padding:12px;margin-bottom:10px}
.inf input,.inf textarea{margin-bottom:8px}
.inf .btns{display:flex;gap:8px}
.inf .btns .btn{padding:9px 14px;font-size:14px}
.confirm{background:#FBE9E6;border-radius:10px;padding:11px 12px;margin-top:8px;font-size:13.5px;color:var(--bad)}
.confirm .btns{display:flex;gap:8px;margin-top:9px}
.confirm button{border:none;border-radius:7px;padding:7px 14px;font-size:13.5px;cursor:pointer;font-family:inherit}
.confirm .yes{background:var(--bad);color:#fff}
.confirm .no{background:#fff;color:var(--muted);border:1px solid var(--line)}
textarea{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:15px;font-family:inherit;min-height:90px}
.sect{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.sect>.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
  padding:13px 15px;background:none;border:none;cursor:pointer;color:inherit;font-size:15px;font-weight:600;text-align:left}
.sect>.hd .cnt{font-size:12.5px;color:var(--muted);font-weight:400}
.arw{color:var(--muted);font-size:14px;display:inline-block;transition:transform .15s}
.arw.op{transform:rotate(90deg)}
.sect>.bd{padding:0 15px 14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 6px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding:3px 0}
.cal .dy{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:8px;font-size:13.5px;background:#E8ECE7;color:var(--ink);cursor:pointer;border:none;font-family:inherit;padding:0}
.cal .dy.off{background:transparent;cursor:default}
.cal .dy.on{background:var(--blue);color:#fff;font-weight:600}
.cal .dy.tdy{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .dy i{font-size:8.5px;font-style:normal;opacity:.9;line-height:1}
.calhd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.calhd button{background:none;border:1px solid var(--line);border-radius:7px;color:var(--ink);
  font-size:16px;padding:3px 13px;cursor:pointer;font-family:inherit}
.wrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #EFF2EE;cursor:pointer}
.wrow:last-child{border-bottom:none}
.wrow input{width:21px;height:21px;accent-color:var(--blue);flex:none;margin:0}
.wrow .nm{flex:1;min-width:0;font-size:15px}
.wrow .rl{font-size:12px;color:var(--muted)}
.lead{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:4px;background:#E7EFE9;
  color:var(--good);font-size:11px;font-weight:600;vertical-align:2px}
.brow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #EFF2EE}
.brow:last-child{border-bottom:none}
.brow input[type=checkbox]{width:21px;height:21px;accent-color:var(--good);flex:none;margin:0}
.brow .rdate{display:block}
.calc{background:#F2F5F1;border-radius:10px;padding:12px 13px;margin:10px 0}
.calc .ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0}
.calc .ln.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-weight:600;font-size:15px}
.wrow.has{background:#F2F7F4;margin:0 -8px;padding:9px 8px;border-radius:7px;border-bottom:none}
.task{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:11px 0;
  border-bottom:1px solid #EFF2EE}
.task:last-child{border-bottom:none}
.tbar{height:5px;background:var(--track);border-radius:3px;margin-top:6px;overflow:hidden}
.tbar i{display:block;height:100%}
.wsel{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:16px;font-family:inherit}
.catsel{border:none;border-radius:5px;font-size:11.5px;padding:2px 4px;margin-top:4px;
  background:#EEF1ED;color:var(--ink);font-family:inherit;max-width:150px}
.catrow{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:5px 0}
.catrow i{width:10px;height:10px;border-radius:3px;flex:none}
.catrow .cn{flex:1;min-width:0}
.catrow .cp{color:var(--muted);font-size:12px;width:38px;text-align:right}
.catrow .ca{font-weight:600;white-space:nowrap}
.prog{margin:10px 0 4px}
.prog .pl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.prog .pb{height:9px;background:var(--track);border-radius:5px;position:relative;display:flex;overflow:hidden}
.prog .pb i{display:block;height:100%}
.prog .pb i:first-child{border-radius:5px 0 0 5px}
.prog .pb .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);
  border-radius:1px;z-index:2;transform:translateX(-1px)}
.prog .pb .mk::after{content:'';position:absolute;top:-3px;left:-2px;width:6px;height:6px;
  border-radius:50%;background:var(--ink)}
.plgd{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:5px}
.plgd i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.warn{background:#FBE9E6;color:var(--bad);border-radius:8px;padding:9px 11px;font-size:13.5px;margin-top:12px;line-height:1.4}
.okmsg{background:#E6F0EA;color:var(--good);border-radius:8px;padding:9px 11px;font-size:13.5px;margin-top:12px;line-height:1.4}
.fc{font-size:13.5px;margin-top:10px;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--blue);padding:0;border:none;background:transparent}
.wtag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;background:#FBE9E6;
  color:var(--bad);font-size:11px;font-weight:600;vertical-align:2px}
.navbtn{display:flex;justify-content:space-between;align-items:center;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  margin-bottom:10px;cursor:pointer;font-size:15px;font-weight:600;color:inherit}

/* ---- шинэ загвар ---- */
.apphd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.apphd img{width:38px;height:38px;border-radius:10px;object-fit:contain;background:#fff;flex:none}
.apphd .t{font-size:17px;font-weight:700;line-height:1.15}
.apphd .u{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .hbig{font-size:30px;font-weight:700;letter-spacing:-.01em;margin:2px 0 2px}
.hmore{background:none;border:none;color:#fff;font-size:13px;font-weight:500;min-height:36px;padding:0;cursor:pointer;font-family:inherit}
.sechd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 10px}
.sechd h2{margin:0;font-size:18px;font-weight:700}
.btn.sm{width:auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-size:14.5px;font-weight:500}
.fchips{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13.5px;cursor:pointer;font-family:inherit}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fchip i{width:8px;height:8px;border-radius:50%;flex:none}
.fchip.on i{box-shadow:0 0 0 1.5px #fff}
.st{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;flex:none}
.st i{width:7px;height:7px;border-radius:50%}
.st.s-ok{background:#E3EFE7;color:#2A5F45} .st.s-ok i{background:#3E8A63}
.st.s-warn{background:#FBF0D9;color:#7A4F00} .st.s-warn i{background:#C98A0B}
.st.s-bad{background:#FBE9E6;color:#A3301F} .st.s-bad i{background:#C9412F}
.st.s-done{background:#E4EAE6;color:var(--good)} .st.s-done i{background:var(--good)}
.jc{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin-bottom:10px;cursor:pointer;color:inherit;font-family:inherit;font-size:inherit}
.jc:active{background:#F7F9F6}
.jc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.jc .nm{font-size:16px;font-weight:700;line-height:1.3}
.jc .dt{font-size:12.5px;color:var(--muted);margin-top:3px}
.n2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.n2 .l{font-size:12px;color:var(--muted)}
.n2 .v{font-size:17px;font-weight:700;margin-top:2px}
.n2 .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.n2 .s b{color:var(--ink);font-weight:600}
.mbar{position:relative;height:6px;border-radius:3px;background:var(--track);margin-top:14px}
.mbar>i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.mbar>.mk{position:absolute;top:-3px;width:2px;height:12px;border-radius:1px;background:var(--ink);transform:translateX(-1px)}
.mline{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:7px}
.mline b{color:var(--ink)}
.mrow{width:100%;min-height:54px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 10px 0 16px;
  background:none;border:none;border-bottom:1px solid #EEF1ED;color:var(--ink);font-size:15px;font-weight:500;cursor:pointer;
  font-family:inherit;text-align:left}
.mrow:last-child{border-bottom:none}
.mrow .r{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13.5px;font-weight:400}
.lrows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.bnav .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px 4px 8px}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:4px 0;background:none;
  border:none;color:var(--muted);font-size:11.5px;font-weight:500;cursor:pointer;font-family:inherit}
.bnav .ic{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:15px}
.bnav button.on{color:var(--ink);font-weight:700}
.bnav button.on .ic{background:#E3E8E4}
.fab{position:fixed;right:max(16px, calc((100vw - 560px) / 2 + 16px));bottom:calc(86px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;border:none;background:var(--ink);color:#fff;display:flex;align-items:center;
  justify-content:center;box-shadow:0 6px 18px rgba(27,42,51,.32);cursor:pointer;z-index:21}
.sheetbg{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(27,42,51,.5);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:22px 22px 0 0;
  padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;max-height:86vh;overflow-y:auto;
  box-shadow:0 -8px 24px rgba(27,42,51,.18)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#C9D1CA;margin:0 auto}
.sheet h2{margin:14px 0 2px;font-size:19px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:11px 10px 11px 12px;border:1px solid var(--line);
  border-radius:14px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;margin-top:10px;font-family:inherit}
.opt .oi{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.opt .ot{display:block;font-size:16px;font-weight:700}
.opt .od{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.jhd{background:var(--surface);margin:-16px -16px 0;padding:4px 16px 10px}
.jhd .bk{display:inline-flex;align-items:center;gap:2px;height:44px;padding:0 8px 0 0;margin-left:-6px;background:none;border:none;
  color:var(--muted);font-size:15px;cursor:pointer;font-family:inherit}
.jhd h1{margin:0;font-size:21px;font-weight:700;line-height:1.25}
.jhd .tg{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.jtabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;box-shadow:0 calc(-1 * env(safe-area-inset-top,0px)) 0 0 var(--surface);background:var(--surface);margin:0 -16px 14px;border-bottom:1px solid var(--line);
  display:flex;gap:2px;padding:0 8px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.jtabs::-webkit-scrollbar{display:none}

const fmt = n => new Intl.NumberFormat('mn-MN',{maximumFractionDigits:0}).format(Math.round(n||0)) + '\u20AE';
const today = () => new Date().toISOString().slice(0,10);
const uid = () => Math.random().toString(36).slice(2,10);
const num = v => parseFloat(String(v).replace(/[^0-9.\-]/g,''));
const group = v => {
  const d = String(v).replace(/[^0-9]/g,'');
  return d ? d.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : '';
};
function liveNum(el){
  const end = el.selectionStart === el.value.length;
  el.value = group(el.value);
  if(end) el.setSelectionRange(el.value.length, el.value.length);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const norm = j => ({
  ...j,
  contract: j.contract ?? j.budget ?? 0,
  incomes: j.incomes||[],
  labor: j.labor||[],
  workers: j.workers||[],
  wagePays: j.wagePays||[],
  bonuses: j.bonuses||[],
  plan: j.plan||[],
  stops: j.stops||[],
  coPct: j.coPct || 0,
  members: j.members||[],
  expenses: (j.expenses||[]).map(e=>({...e, asset: !!e.asset}))
});

function clean(v){
  if(Array.isArray(v)) return v.map(clean);
  if(v && typeof v === 'object'){
    const o = {};
    Object.keys(v).forEach(k => { if(v[k] !== undefined) o[k] = clean(v[k]); });
    return o;
  }
  return v;
}

const LISTS = ['expenses','incomes','labor','workers','wagePays','bonuses','plan','stops'];
const FIELDS = ['name','contract','type','progress','done','doneDate','members','owner','createdAt','createdBy','coPct','startDate','endDate'];

let me = null, admin = null, booted = false, syncErr = '', pendingRender = false;
const isAdmin = () => !!me && me === admin;

const curMatPct = () => (typeof matPct === 'number') ? matPct : MATPCT_DEF;
const pctOf = v => { let x = parseFloat(String(v).replace(',','.')); if(!(x >= 0)) x = 0; return Math.min(100, Math.round(x*100)/100); };
const canMat = () => isAdmin() || (!!me && matUsers.indexOf(me) >= 0);
let shadow = {}, rshadow = {}, sshadow = {};

function legacyJobs(){
  try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; }
}

function cloudRender(){
  const ae = document.activeElement;
  if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){ pendingRender = true; return; }
  render();
}

function jobDiff(prev, j){
  const u = {}, extra = [];
  FIELDS.forEach(k => {
    if(JSON.stringify(prev[k]) !== JSON.stringify(j[k]))
      u[k] = j[k] === undefined ? FB.deleteField() : clean(j[k]);
  });
  LISTS.forEach(k => {
    const a = prev[k]||[], b = j[k]||[];
    if(JSON.stringify(a) === JSON.stringify(b)) return;
    const ai = new Map(a.map(x=>[x.id,JSON.stringify(x)])), bi = new Map(b.map(x=>[x.id,1]));
    const added = b.filter(x => !ai.has(x.id));
    const removed = a.filter(x => !bi.has(x.id));
    const edited = b.some(x => ai.has(x.id) && ai.get(x.id) !== JSON.stringify(x));
    if(edited || (added.length && removed.length)) u[k] = clean(b);
    else if(added.length) u[k] = FB.arrayUnion.apply(null, clean(added));
    else if(removed.length) u[k] = FB.arrayRemove.apply(null, clean(removed));
  });
  return u;
}

function save(){
  if(!me || !window.FB) return;
  jobs.forEach(j => {
    const cur = JSON.stringify(j);
    if(shadow[j.id] === cur) return;
    const prev = shadow[j.id] ? JSON.parse(shadow[j.id]) : null;
    shadow[j.id] = cur;
    const ref = FB.doc(FB.db, 'jobs', j.id);
    try {
      const p = prev ? FB.updateDoc(ref, jobDiff(prev, j)) : FB.setDoc(ref, clean(j));
      p.catch(e => { syncErr = e.code || e.message || 'алдаа'; setTimeout(render, 0); });
    } catch(e) {
      syncErr = e.code || e.message || 'алдаа';
      setTimeout(render, 0);
    }
  });
  Object.keys(shadow).forEach(id => {
    if(!jobs.some(j => j.id === id)){
      delete shadow[id];
      try { FB.deleteDoc(FB.doc(FB.db, 'jobs', id)).catch(e => { syncErr = e.code||'алдаа'; }); }
      catch(e) { syncErr = e.code || e.message || 'алдаа'; }
    }
  });
}

function saveMatUsers(){
  if(!me || !window.FB || !isAdmin()) return;
  try {
    FB.setDoc(FB.doc(FB.db, 'config', 'admin'), clean({email: admin || me, mat: matUsers, matPct: curMatPct()}))
      .catch(e => { syncErr = e.code||'алдаа'; setTimeout(render, 0); });
  } catch(e) { syncErr = e.code || e.message || 'алдаа'; setTimeout(render, 0); }
}

function toggleMat(em){
  if(!isAdmin()) return;
  em = String(em||'').toLowerCase();
  if(!em || em === admin) return;
  matUsers = matUsers.indexOf(em) >= 0 ? matUsers.filter(x => x !== em) : matUsers.concat([em]);
  saveMatUsers(); render();
}

      delete oshadow[id];

  });
}

function subscribe(){
  const F = window.FB;
  F.onSnapshot(
    F.query(F.collection(F.db, 'jobs'), F.where('members', 'array-contains', me)),
    snap => {
      jobs = snap.docs.map(d => norm({...d.data(), id: d.id}))
        .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
      shadow = {}; jobs.forEach(j => shadow[j.id] = JSON.stringify(j));
      booted = true; syncErr = ''; cloudRender();
    },
    e => { syncErr = e.code || 'холболтын алдаа'; booted = true; render(); }
  );
  F.onSnapshot(
    F.query(F.collection(F.db, 'roster'), F.where('owner', '==', admin || me)),
    snap => {
      roster = snap.docs.map(d => ({...d.data(), id: d.id}));
      rshadow = {}; roster.forEach(r => rshadow[r.id] = JSON.stringify(r));
      cloudRender();
    },
    ()=>{}
  );
  F.onSnapshot(
    F.doc(F.db, 'config', 'admin'),
    d => {
      const ok = !!(d && d.exists && d.exists());
      const v = ok ? (d.data().mat||[]) : [];
      const nw = v.map(x => String(x).toLowerCase());
      const mp = (ok && typeof d.data().matPct === 'number') ? d.data().matPct : null;
      if(JSON.stringify(nw) !== JSON.stringify(matUsers) || mp !== matPct){ matUsers = nw; matPct = mp; cloudRender(); }
    },
    ()=>{}
  );
  if(isAdmin()){
    F.onSnapshot(
      F.query(F.collection(F.db, 'overhead'), F.where('owner', '==', admin || me)),
      snap => {
        overhead = snap.docs.map(d => ({...d.data(), id: d.id}));
        oshadow = {}; overhead.forEach(x => oshadow[x.id] = JSON.stringify(x));
        cloudRender();
      },
      ()=>{}
    );
  }
  F.onSnapshot(
    F.query(F.collection(F.db, 'sup'), F.where('owner', '==', admin || me)),
    snap => {
      sups = snap.docs.map(d => ({...d.data(), id: d.id, pays: (d.data().pays)||[]}));
      supShadow = {}; sups.forEach(x => supShadow[x.id] = JSON.stringify(x));
      cloudRender();
    },
    ()=>{}
  );
  F.onSnapshot(
    F.query(F.collection(F.db, 'stock'), F.where('owner', '==', admin || me)),
    snap => {
      stock = snap.docs.map(d => ({...d.data(), id: d.id, moves: (d.data().moves)||[]}));
      sshadow = {}; stock.forEach(x => sshadow[x.id] = JSON.stringify(x));
      cloudRender();
    },
    ()=>{}
  );
}

const AKEY = 'auth-save';
function savedAuth(){
  try{ return JSON.parse(localStorage.getItem(AKEY) || '{}') || {}; }catch(e){ return {}; }
}
function storeAuth(em, pw, keep){
  try{
    if(keep) localStorage.setItem(AKEY, JSON.stringify({email: em, pass: pw}));
    else localStorage.removeItem(AKEY);
  }catch(e){}
}

function doLogin(signup){
  const F = window.FB;
  const em = document.getElementById('authEmail').value.trim().toLowerCase();
  const pw = document.getElementById('authPass').value;
  if(!em || pw.length < 6){ ui.authErr = 'Имэйл болон 6-аас дээш тэмдэгт бүхий нууц үг оруулна уу.'; render(); return; }
  ui.authErr = ''; ui.authOk = ''; ui.authBusy = 1; render();
  const keepEl = document.getElementById('authKeep');
  const keep = keepEl ? keepEl.checked : true;
  const fn = signup ? F.createUserWithEmailAndPassword : F.signInWithEmailAndPassword;
  fn(F.auth, em, pw).then(() => storeAuth(em, pw, keep)).catch(e => {
    const m = {
      'auth/invalid-credential':'Имэйл эсвэл нууц үг буруу байна.',
      'auth/wrong-password':'Нууц үг буруу байна.',
      'auth/user-not-found':'Ийм хэрэглэгч алга. "Шинээр бүртгүүлэх" дарна уу.',
      'auth/email-already-in-use':'Энэ имэйл бүртгэлтэй байна. "Нэвтрэх" дарна уу.',
      'auth/weak-password':'Нууц үг хэт богино байна.',
      'auth/invalid-email':'Имэйл буруу байна.',
      'auth/network-request-failed':'Интернэт холболтоо шалгана уу.'
    };
    ui.authErr = m[e.code] || e.code;
    ui.authBusy = 0; render();
  });
}

function resetPass(){
  const F = window.FB;
  const em = (document.getElementById('authEmail').value||'').trim().toLowerCase();
  if(!em || em.indexOf('@') < 0){
    ui.authErr = 'Эхлээд имэйлээ бичнэ үү, тэгээд энэ товчийг дарна уу.';
    ui.authOk = ''; render(); return;
  }
  ui.authErr = ''; ui.authOk = ''; ui.lastEmail = em; ui.authBusy = 1; render();
  F.sendPasswordResetEmail(F.auth, em).then(() => {
    ui.authBusy = 0;
    ui.authOk = em + ' хаяг руу сэргээх линк илгээлээ. Шуудангаа (мөн спам хавтсаа) шалгана уу.';
    render();
  }).catch(e => {
    const m = {
      'auth/user-not-found':'Ийм имэйлээр бүртгэл алга. Зөв бичсэн эсэхээ шалгана уу.',
      'auth/invalid-email':'Имэйл буруу байна.',
      'auth/too-many-requests':'Хэт олон удаа оролдлоо. Хэсэг хүлээгээд дахин оролдоно уу.',
      'auth/network-request-failed':'Интернэт холболтоо шалгана уу.'
    };
    ui.authErr = m[e.code] || e.code;
    ui.authBusy = 0; render();
  });
}

function logout(){

}

function authView(){
  const sv = savedAuth();
  const em = ui.lastEmail || sv.email || '';
  const pw = sv.pass || '';
  const keep = sv.email ? true : (ui.keep !== false);
  return '<div style="padding:40px 0 0"><div style="text-align:center;margin-bottom:26px">'
    + '<img src="icon-192.png" alt="" style="width:76px;height:76px;margin-bottom:10px">'
    + '<div style="font-size:22px;font-weight:700">Смарт Солгрид ХХК</div>'
    + '<div style="color:var(--muted);font-size:14px;margin-top:5px">Имэйлээрээ нэвтэрч ажлаа үргэлжлүүлнэ</div></div>'
    + '<form class="card" onsubmit="doLogin(false);return false">'
    + '<input id="authEmail" name="username" type="email" inputmode="email" autocomplete="username" '
    + 'placeholder="Имэйл" style="margin-bottom:9px" value="'+esc(em)+'">'
    + '<input id="authPass" name="password" type="password" autocomplete="current-password" '
    + 'placeholder="Нууц үг" style="margin-bottom:10px" value="'+esc(pw)+'">'
    + '<label class="check" style="margin:0 0 12px"><input type="checkbox" id="authKeep"'
    + (keep?' checked':'')+'>Нэр, нууц үгийг сануулах</label>'
    + (ui.authErr ? '<div class="warn" style="margin:0 0 12px">'+esc(ui.authErr)+'</div>' : '')
    + '<button type="submit" class="btn" style="margin-bottom:8px">'
    + (ui.authBusy ? 'Түр хүлээнэ үү…' : 'Нэвтрэх')+'</button>'
    + '<button type="button" class="btn ghost" style="width:100%" onclick="doLogin(true)">Шинээр бүртгүүлэх</button>'
    + (ui.authOk ? '<div class="okmsg" style="margin-top:12px">'+esc(ui.authOk)+'</div>' : '')
    + '<div style="text-align:center;margin-top:14px">'
    + '<button type="button" class="small" style="border:none" onclick="resetPass()">Нууц үгээ мартсан уу?</button></div>'
    + '</form>'
    + '<div class="note" style="margin-top:14px;text-align:center">Анх удаа бол "Шинээр бүртгүүлэх" дарна уу.</div></div>';
}

function migrateLocal(){
  const old = legacyJobs();
  if(!old.length) return;
  old.forEach((j, i) => {

function effEnd(j){
  const b = dnum(j.endDate);
  if(!b) return 0;
  return b + stopDays(j) * 86400000;
}
function timePct(j){
  const a = dnum(j.startDate), b = effEnd(j);
  if(!a || !b || b <= a) return null;
  const n = dnum(today());
  return Math.max(0, Math.min(100, (n - a) / (b - a) * 100));
}
function daysLeft(j){
  const b = effEnd(j);
  if(!b) return null;
  return Math.round((b - dnum(today())) / 86400000);
}
const dayShare = (j,wid,dt) => {
  const n = (j.labor||[]).filter(e=>e.workerId===wid && e.date===dt).length;
  return n ? 1/n : 0;
};

function jobStatus(j){
  if(j.done) return {k:'s-done', t:'Дууссан', g:'done'};
  const pr = jobProgress(j), tp = timePct(j), dl = daysLeft(j), sp = spentPct(j), lag = lagOf(j);
  const behind = tp === null ? 0 : tp - pr;
  if(dl !== null && dl < 0 && pr < 100) return {k:'s-bad', t:'Хугацаа хэтэрсэн', g:'bad'};
  if(sp > 100) return {k:'s-bad', t:'Төсөв хэтэрсэн', g:'bad'};
  if(behind >= 25) return {k:'s-bad', t:'Хоцорсон', g:'bad'};

  return {k:'s-ok', t:'Хэвийн', g:'ok'};
}

const OCATS = [
  {k:'acc',    t:'Нягтлан/аудит',   c:'#2A5F7A'},
  {k:'lic',    t:'Тусгай зөвшөөрөл', c:'#8A6A1F'},
  {k:'office', t:'Оффис түрээс',     c:'#6B4C8A'},
  {k:'comm',   t:'Холбоо/интернэт',  c:'#C0762F'},
  {k:'bank',   t:'Банк/даатгал',     c:'#2F6B4F'},
  {k:'tax',    t:'Татвар/хураамж',   c:'#A33D5C'},
  {k:'other',  t:'Бусад',            c:'#8E9AA0'}
];
const ocatOf = k => OCATS.find(c=>c.k===k) || OCATS[OCATS.length-1];
const ymOf = d => String(d||'').slice(0,7);
function addMonth(m, n){
  let y = parseInt(m.slice(0,4),10), mo = parseInt(m.slice(5,7),10) - 1 + n;
  y += Math.floor(mo/12); mo = ((mo % 12) + 12) % 12;
  return y + '-' + String(mo+1).padStart(2,'0');
}
function recDate(o, m){
  const dim = new Date(parseInt(m.slice(0,4),10), parseInt(m.slice(5,7),10), 0).getDate();
  return m + '-' + String(Math.min(o.day||1, dim)).padStart(2,'0');
}
// нэг удаагийн бичилт + сар бүрийн загвараас үүссэн бичилтүүд (өнөөдрийг хүртэл)
function ohEntries(){
  const out = [], td = today();
  overhead.forEach(o => {
    if(o.kind === 'rec'){
      if(!/^\d{4}-\d{2}$/.test(o.from||'')) return;
      const last = (o.until && o.until < ymOf(td)) ? o.until : ymOf(td);
      let m = o.from, guard = 0;
      while(m <= last && guard++ < 600){
        if((o.skip||[]).indexOf(m) < 0){
          const dd = recDate(o, m);
          if(dd <= td) out.push({id: o.id+'@'+m, rid: o.id, desc: o.desc, cat: o.cat, amount: o.amount||0,
                                 date: dd, rec: true, by: o.by});
        }
        m = addMonth(m, 1);
      }
    } else if(o.date){
      out.push({id: o.id, desc: o.desc, cat: o.cat, amount: o.amount||0, date: o.date, rec: false, by: o.by});
    }
  });
  return out.sort((a,b) => a.date < b.date ? 1 : (a.date > b.date ? -1 : 0));
}

function pickOCat(el, k){
  oCat = k;
  el.parentNode.querySelectorAll('.chip').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
}
function addOH(){
  const g = id => (document.getElementById(id)||{}).value || '';
  const desc = g('ohDesc').trim(), amt = num(g('ohAmt')), dt = g('ohDate') || today();
  const recEl = document.getElementById('ohRec');
  const rec = !!(recEl && recEl.checked);
  if(!desc){ alert('Тайлбараа оруулна уу.'); return; }
  if(!(amt > 0)){ alert('Дүнгээ оруулна уу.'); return; }
  if(rec){
    overhead.push({id: uid(), kind: 'rec', desc: desc, cat: oCat, amount: amt,
                   day: parseInt(dt.slice(8,10),10) || 1, from: dt.slice(0,7), until: '', skip: [],
                   by: me||'', owner: admin||me});
  } else {
    overhead.push({id: uid(), kind: 'one', desc: desc, cat: oCat, amount: amt, date: dt,
                   by: me||'', owner: admin||me});
  }
  saveOH(); ui = {}; render();
}
function delOH(id){
  const at = id.indexOf('@');
  if(at > 0){
    const o = overhead.find(x => x.id === id.slice(0, at));
    if(o) o.skip = (o.skip||[]).concat([id.slice(at+1)]);
  } else {
    overhead = overhead.filter(x => x.id !== id);
  }
  saveOH(); render();
}
function stopRec(id){
  const o = overhead.find(x => x.id === id); if(!o) return;
  const td = today(), m = ymOf(td);
  o.until = recDate(o, m) <= td ? m : addMonth(m, -1);
  saveOH(); ui = {}; render();
}
function resumeRec(id){
  const o = overhead.find(x => x.id === id); if(!o) return;
  o.until = ''; saveOH(); ui = {}; render();
}
function delRec(id){
  overhead = overhead.filter(x => x.id !== id);
  saveOH(); ui = {}; render();
}

// ---------- компанийн ашиг ----------
// ажлаас компанид ногдох ашиг: удирдагчтай бол гэрээ × компанийн %, үгүй бол бүтэн ашиг
function coProfit(j){
  const c = bonusCalc(j, j.workers||[]);
  return c.totalDays > 0 ? c.gross - Math.max(0, c.pool) : c.gross;
}
function coYear(y){
  y = String(y);
  const doneY = jobs.filter(j => j.done && String(j.doneDate||'').slice(0,4) === y);
  const jobP = doneY.reduce((t,j)=>t+coProfit(j), 0);
  let matP = 0;
  const mo = {};
  const add = (d, k, v) => { const m = d.slice(0,7); mo[m] = mo[m] || {job:0, mat:0, oh:0}; mo[m][k] += v; };
  doneY.forEach(j => add(j.doneDate, 'job', coProfit(j)));
  stock.forEach(it => (it.moves||[]).forEach(mv => {
    if(String(mv.date||'').slice(0,4) !== y) return;
    const v = ((mv.price||0) - mvCost(it, mv)) * (mv.qty||0) - (mv.sbon||0);
    matP += v; add(mv.date, 'mat', v);
  }));
  const E = ohEntries().filter(e => e.date.slice(0,4) === y);
  const ohT = E.reduce((t,e)=>t+e.amount, 0);
  E.forEach(e => add(e.date, 'oh', e.amount));
  const contracts = doneY.reduce((t,j)=>t+j.contract, 0);
  return {y: y, doneY: doneY, jobP: jobP, matP: matP, ohT: ohT, net: jobP + matP - ohT,
          contracts: contracts, rate: (contracts > 0 ? ohT / contracts * 100 : null), mo: mo};
}
// компанийн хувь тогтооход харуулах байгууллагын зардлын хувь
function ohRateInfo(){
  const y = parseInt(today().slice(0,4),10);
  for(const yy of [y, y-1]){
    const r = coYear(yy);
    if(r.contracts > 0 && r.ohT > 0) return r;
  }
  return null;
}
function ohHint(pct){
  const r = ohRateInfo();
  if(!r) return '';
  const v = Math.round(r.rate*10)/10;
  return pct < r.rate
    ? '<div class="warn" style="margin:8px 0 0">Байгууллагын зардал '+r.y+' онд дууссан ажлуудын гэрээний ~'+v
      + '% эзэлсэн. Компанийн хувь ('+pct+'%) үүнээс бага тул урамшуулал олгосны дараа компанид алдагдал '
      + 'гарч болзошгүй.</div>'
    : '<div class="rdate" style="margin:6px 0 0">Байгууллагын зардал '+r.y+' онд гэрээний ~'+v
      + '% · компанийн хувь үүнийг нөхөж байна.</div>';
}

// оны эхнээс хуримтлагдсан ашгийн шугаман график
function cumChart(r, y, cur){
  const last = (y === cur) ? parseInt(today().slice(5,7),10) - 1 : 11;
  const net = [], cum = [];
  let c = 0;
  for(let i = 0; i <= last; i++){
    const x = r.mo[y+'-'+String(i+1).padStart(2,'0')];
    const n = x ? x.job + x.mat - x.oh : 0;
    net.push(n); c += n; cum.push(c);
  }
  if(!Object.keys(r.mo).length) return '';
  const W = 340, H = 168, L = 34, R = 10, T = 14, B = 22;
  let hi = Math.max(0, ...cum), lo = Math.min(0, ...cum);
  if(hi === lo) hi = lo + 1000000;
  const span = hi - lo;
  const steps = [1e5,2e5,5e5,1e6,2e6,5e6,1e7,2e7,5e7,1e8,2e8,5e8,1e9];
  const step = steps.find(v => span / v <= 4) || steps[steps.length-1];
  hi = Math.ceil(hi / step) * step; lo = Math.floor(lo / step) * step;
  const yy = v => T + (H - T - B) * (hi - v) / (hi - lo);
  const xx = i => L + (W - L - R) * i / 11;
  const lab = v => { const a = v / 1e6; return (Math.round(a*10)/10) + 'с'; };
  let s = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Оны эхнээс хуримтлагдсан ашиг" style="display:block;margin-top:8px">';
  for(let v = lo; v <= hi + 1; v += step){
    s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy(v)+'" y2="'+yy(v)+'" stroke="'+(v === 0 ? '#8E9AA0' : '#EEF1ED')+'"/>'
      + '<text x="'+(L-5)+'" y="'+(yy(v)+3)+'" font-size="9.5" fill="#7D8A90" text-anchor="end">'+lab(v)+'</text>';
  }
  const pts = cum.map((v,i) => xx(i)+','+yy(v)).join(' ');
  s += '<polygon points="'+xx(0)+','+yy(0)+' '+pts+' '+xx(cum.length-1)+','+yy(0)+'" fill="#E3EFE7" opacity=".85"/>'
    + '<polyline points="'+pts+'" fill="none" stroke="#2F6B4F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  cum.forEach((v,i) => {
    s += '<circle cx="'+xx(i)+'" cy="'+yy(v)+'" r="'+(i === last ? 5 : 3.2)+'" fill="'+(net[i] < 0 ? '#C9412F' : '#2F6B4F')
      + '" stroke="#fff" stroke-width="1.5"/>';
  });
  for(let i = 0; i < 12; i++){
    s += '<text x="'+xx(i)+'" y="'+(H-6)+'" font-size="10" fill="'+(i === last ? '#1B2A33' : (i > last ? '#B8C1C4' : '#7D8A90'))
      + '" font-weight="'+(i === last ? '700' : '400')+'" text-anchor="middle">'+(i+1)+'</text>';
  }
  s += '</svg>';
  const tot = cum[cum.length-1];
  return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">'
    + '<span style="font-weight:700;font-size:15px">Оны эхнээс хуримтлагдсан ашиг</span></div>'
    + '<div style="display:flex;align-items:baseline;gap:8px;margin-top:4px">'
    + '<span style="font-size:24px;font-weight:700" class="'+(tot<0?'neg':'pos')+'">'+fmt(tot)+'</span>'
    + '<span class="rdate">'+(last+1)+'-р сар хүртэл</span></div>'
    + s
    + '<div style="display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px">'
    + '<span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#2F6B4F;margin-right:5px"></i>ашигтай сар</span>'
    + '<span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#C9412F;margin-right:5px"></i>алдагдалтай сар</span></div>'
    + '</div>';
}

// ---------- нийлүүлэгч, өглөг ----------
const supBought = sid => stock.reduce((t,it) => t + (it.buys||[]).filter(b=>b.sup===sid)
  .reduce((u,b)=>u+(b.qty||0)*(b.cost||0), 0), 0);
const supPaid = x => (x.pays||[]).reduce((t,p)=>t+(p.amount||0), 0);
const supOwe = x => supBought(x.id) - supPaid(x);
const supOweAll = () => sups.reduce((t,x)=>t+Math.max(0, supOwe(x)), 0);
// нийлүүлэгчийн өглөгийг материал тус бүрээр: тодорхой хуваарилсан төлбөр + хуваарилаагүйг эхэнд авснаас нь
function supLedger(x){
  const rows = [];
  stock.forEach(it => {
    const B = (it.buys||[]).filter(b => b.sup === x.id);
    if(!B.length) return;
    rows.push({it: it, qty: B.reduce((t,b)=>t+(b.qty||0), 0),
               bought: B.reduce((t,b)=>t+(b.qty||0)*(b.cost||0), 0),
               date: B.map(b=>b.date||'').sort()[0] || '', paid: 0});
  });
  let free = 0;
  (x.pays||[]).forEach(p => {
    if(p.alloc && p.alloc.length){
      let rest = p.amount||0;
      p.alloc.forEach(a => {
        const r = rows.find(r => r.it.id === a.item), v = a.amt||0;
        if(r) r.paid += v; else free += v;
        rest -= v;
      });
      if(rest > 0.5) free += rest;
    } else {
      free += p.amount||0;
    }
  });
  rows.sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  rows.forEach(r => {
    const use = Math.min(Math.max(0, r.bought - r.paid), free);
    r.paid += use; free -= use;
  });
  rows.forEach(r => { r.owe = Math.max(0, r.bought - r.paid); });
  return {rows: rows, credit: free};
}
// нэг материалын бүх нийлүүлэгчид үлдсэн өглөг
function itemOwe(it){
  const ids = [];
  (it.buys||[]).forEach(b => { if(b.sup && ids.indexOf(b.sup) < 0) ids.push(b.sup); });
  return ids.reduce((t,sid) => {
    const x = sups.find(y=>y.id===sid); if(!x) return t;
    const r = supLedger(x).rows.find(r => r.it.id === it.id);
    return t + (r ? r.owe : 0);
  }, 0);
}
function paySum(){
  let t = 0;
  document.querySelectorAll('input[data-pa]').forEach(el => { t += num(el.value||'') || 0; });
  const o = document.getElementById('paTot'); if(o) o.textContent = fmt(t);
  const b = document.getElementById('paBtn'); if(b) b.textContent = 'Олгох · ' + fmt(t);
}
function fillPay(iid, v){
  const el = document.getElementById('pa_'+iid);
  if(el){ el.value = group(v); paySum(); }
}
function fillPayAll(){
  document.querySelectorAll('input[data-pa]').forEach(el => { el.value = group(+el.getAttribute('data-max')); });
  paySum();
}
function lastSup(it){
  const L = (it.buys||[]).filter(b=>b.sup);
  if(!L.length) return null;
  return sups.find(x=>x.id===L[L.length-1].sup) || null;
}
function supIdOf(name){
  name = String(name||'').trim();
  if(!name) return '';
  const k = name.toLowerCase();
  let x = sups.find(y => String(y.name||'').trim().toLowerCase() === k);
  if(!x){ x = {id: uid(), name: name, pays: [], owner: admin||me}; sups.push(x); }
  return x.id;
}
function payTo(sid, amt, date, note, alloc){
  const x = sups.find(y=>y.id===sid); if(!x) return;
  x.pays = x.pays || [];
  const p = {id: uid(), date: date || today(), amount: amt, note: note||'', by: me||''};
  if(alloc && alloc.length) p.alloc = alloc;
  x.pays.push(p);
}

function readSup(pf){
  const g = id => document.getElementById(id);
  return {name: ((g(pf+'Sup')||{}).value||'').trim(),
          date: (g(pf+'Date')||{}).value || today(),
          paid: !!((g(pf+'Paid')||{}).checked)};
}
function restock(id){
  const it = stock.find(x=>x.id===id); if(!it) return;
  const q = parseFloat(String((document.getElementById('sbQty')||{}).value||'').replace(',','.'));
  const c = num((document.getElementById('sbCost')||{}).value||'');
  if(!(q > 0)){ alert('Ширхэгийн тоог оруулна уу.'); return; }
  if(!(c >= 0)){ alert('Нэгж өртгөө оруулна уу.'); return; }
  const b = readSup('sb');
  // өмнөх гүйлгээний өртгийг тогтоож, дундаж өртөг тооцно
  (it.moves||[]).forEach(m => { if(m.cost === undefined || m.cost === null) m.cost = it.cost||0; });
  const left = stockLeft(it);
  it.cost = Math.round((left*(it.cost||0) + q*c) / (left + q));
  it.qty = (it.qty||0) + q;
  const sid = b.name ? supIdOf(b.name) : '';
  it.buys = it.buys || [];
  it.buys.push({id: uid(), date: b.date, qty: q, cost: c, sup: sid});
  if(sid && b.paid && q*c > 0) payTo(sid, q*c, b.date, it.name, [{item: it.id, amt: q*c}]);
  saveStock(); saveSup(); ui = {}; render();
}
function paySup(sid){
  const x = sups.find(y=>y.id===sid); if(!x || !isAdmin()) return;
  const dt = (document.getElementById('spDate')||{}).value || today();
  const led = supLedger(x);
  const alloc = [];
  let bad = '';
  document.querySelectorAll('input[data-pa]').forEach(el => {
    const v = num(el.value||'') || 0;
    if(!(v > 0)) return;
    const iid = el.getAttribute('data-pa');
    const r = led.rows.find(r => r.it.id === iid);
    if(!r) return;
    if(v > r.owe + 0.5) bad = r.it.name+' — өглөг '+fmt(r.owe)+'-с их байна.';
    alloc.push({item: iid, amt: v});
  });
  if(bad){ alert(bad); return; }
  const tot = alloc.reduce((t,a)=>t+a.amt, 0);
  if(!(tot > 0)){ alert('Материал дээр олгох дүнгээ бичнэ үү.'); return; }
  payTo(sid, tot, dt, '', alloc);
  saveSup(); ui = {}; render();
}
function delSupPay(sid, pid){
  const x = sups.find(y=>y.id===sid); if(!x || !isAdmin()) return;
  x.pays = (x.pays||[]).filter(p=>p.id!==pid);
  saveSup(); render();
}
function delSup(sid){
  if(!isAdmin()) return;
  sups = sups.filter(x=>x.id!==sid);
  saveSup(); ui = {}; render();
}

function render(){
  if(!window.FB){ document.getElementById('app').innerHTML =
    '<div class="note" style="padding:40px 0;text-align:center">Ачаалж байна…</div>'; return; }
  if(!me){ document.getElementById('app').innerHTML = authView(); return; }
  if(!booted){ document.getElementById('app').innerHTML =
    '<div class="note" style="padding:40px 0;text-align:center">Өгөгдөл ачаалж байна…</div>'; return; }
  const job = jobs.find(j=>j.id===openId);
  let html;
  if(job) html = detailView(job);
  else if(view === 'assets' && isAdmin()) html = assetsView();
  else if(view === 'done') html = doneView();
  else if(view === 'types' && isAdmin()) html = typesView();
  else if(view === 'roster') html = rosterView();
  else if(view === 'stock' && canMat()) html = stockView();
  else if(view === 'sup' && canMat()) html = supView();
  else if(view === 'oh' && isAdmin()) html = ohView();
  else if(view === 'coprof' && isAdmin()) html = coProfView();
  else if(view === 'more') html = moreView();
  else html = listView();
  html += bottomNav();
  if(job && !job.done){
    html += '<button class="fab" aria-label="Бүртгэл нэмэх" onclick="ui={sheet:1};render()">'+IC.plusBig+'</button>';
  }
  if(job && ui.sheet) html += quickSheet(job);
  document.getElementById('app').innerHTML = html;
  document.querySelectorAll('.chartscroll').forEach(el => { el.scrollLeft = el.scrollWidth; });
  const at = document.querySelector('.jtabs .on');
  if(at){
    const pn = at.parentNode;
    if(at.offsetLeft + at.offsetWidth > pn.scrollLeft + pn.clientWidth || at.offsetLeft < pn.scrollLeft){
      pn.scrollLeft = Math.max(0, at.offsetLeft - 24);
    }
  }
}

function progBars(j){
  const pr = jobProgress(j), sp = spentPct(j);
  const bn = j.contract ? bonusTotal(j) / j.contract * 100 : 0;
  const base = Math.max(0, sp - bn);
  const bcol = (sp - pr >= 10 || sp > 100) ? 'var(--bad)' : 'var(--good)';
  const tp = timePct(j);
  const mk = tp === null ? '' : '<span class="mk" style="left:'+tp+'%"></span>';

  let h = '<div class="prog"><div class="pl"><span>Гүйцэтгэл</span><span>'+Math.round(pr)+'%</span></div>'
    + '<div class="pb">'+mk+'<i style="width:'+Math.min(pr,100)+'%;background:var(--blue)"></i></div></div>'
    + '<div class="prog"><div class="pl"><span>Төсвийн зарцуулалт</span><span>'
    + Math.round(sp)+'%</span></div>'
    + '<div class="pb">'+mk
    + '<i style="width:'+Math.min(base,100)+'%;background:'+bcol+'"></i>'
    + (bn > 0 ? '<i style="width:'+Math.min(bn, Math.max(0,100-base))+'%;background:var(--asset)"></i>' : '')
    + '</div>';
  if(bn > 0){
    h += '<div class="plgd"><span><i style="background:'+bcol+'"></i>Зардал '+Math.round(base)+'%</span>'
      + '<span><i style="background:var(--asset)"></i>Урамшуулал '+Math.round(bn)+'%</span></div>';
  }
  h += '</div>';
  if(tp !== null){
    const dl = daysLeft(j);
    h += '<div class="plgd" style="margin:0 0 10px"><span>| Хугацаа '+Math.round(tp)+'%'
      + (dl !== null ? (dl >= 0 ? ' · '+dl+' хоног үлдсэн' : ' · '+(-dl)+' хоног хоцорсон') : '')
      + (pr - tp <= -10 ? ' · <b style="color:var(--bad)">хоцорч байна</b>' : '')
      + '</span></div>';
  } else {
    h += '<div style="height:10px"></div>';
  }
  return h;
}

      + 'ашиг ≈ <b class="'+(fprofit<0?'neg':'pos')+'">'+fmt(fprofit)+'</b></div>';
  }
  if(pr > 0 && md > 0){
    h += '<div class="fc">Хөдөлмөр: '+nd(md)+' хүн өдөр зарцуулсан, дуустал нийт ≈ <b>'
      + nd(Math.round(md/pr*100))+' хүн өдөр</b> шаардагдана</div>';

  }
  return h + '</div>';
}

function addStop(){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const d = parseInt(String((document.getElementById('stDays')||{}).value||'').replace(/[^0-9]/g,''), 10);
  if(!(d > 0)){ alert('Хоногийн тоог оруулна уу.'); return; }
  j.stops = j.stops || [];
  j.stops.push({id: uid(), days: d,
    note: ((document.getElementById('stNote')||{}).value||'').trim(),
    date: (document.getElementById('stDate')||{}).value || today(),
    by: me || ''});
  save(); ui = {}; render();
}

function delStop(sid){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  j.stops = (j.stops||[]).filter(x=>x.id!==sid);
  save(); render();
}

function catCard(j, bare){
  if(j.expenses.length === 0) return '';
  const tot = spent(j);
  // урамшууллыг цалингаас тусгаарлана
  const bonIds = {};
  (j.bonuses||[]).forEach(b => { if(b.expenseId) bonIds[b.expenseId] = 1; });
  const rows = CATS.map(c => ({
    c: c,
    v: j.expenses.filter(e => catOf(e.cat).k === c.k && !(c.k === 'wage' && bonIds[e.id]))
        .reduce((s,e)=>s+e.amount, 0)
  }));
  const bonV = j.expenses.filter(e => bonIds[e.id]).reduce((s,e)=>s+e.amount, 0);
  if(bonV > 0) rows.push({c: {k:'bonus', t:'Урамшуулал', c:'#8A6A1F'}, v: bonV});
  rows.sort((a,b)=>b.v-a.v);
  const shown = rows.filter(r=>r.v>0);
  // donut
  const R = 46, C = 2*Math.PI*R;
  let off = 0, arcs = '';
  shown.forEach(r => {
    const len = r.v / tot * C;
    arcs += '<circle r="'+R+'" cx="60" cy="60" fill="none" stroke="'+r.c.c+'" stroke-width="18" '
      + 'stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 60 60)"></circle>';
    off += len;
  });
  let h = (bare ? '<div>' : '<div class="card" style="margin-bottom:18px"><div style="font-weight:600;margin-bottom:10px">Зардлын бүтэц</div>')
    + '<div style="display:flex;gap:14px;align-items:center">'
    + '<svg width="120" height="120" viewBox="0 0 120 120" style="flex:none">'+arcs+'</svg><div style="flex:1;min-width:0">';
  shown.forEach(r => {
    h += '<div class="catrow"><i style="background:'+r.c.c+'"></i><span class="cn">'+r.c.t+'</span>'
      + '<span class="cp">'+Math.round(r.v/tot*100)+'%</span></div>';
  });
  h += '</div></div><div style="margin-top:10px;border-top:1px solid var(--line);padding-top:6px">';
  shown.forEach(r => {
    h += '<div class="catrow"><i style="background:'+r.c.c+'"></i><span class="cn">'+r.c.t+'</span>'
      + '<span class="ca">'+fmt(r.v)+'</span></div>';
  });
  return h + '</div></div>';
}

function chartSvg(j){
  const map = {};
  j.incomes.forEach(e => { (map[e.date] = map[e.date] || {i:0,x:0}).i += e.amount; });
  j.expenses.forEach(e => { (map[e.date] = map[e.date] || {i:0,x:0}).x += e.amount; });
  const days = Object.keys(map).sort();
  if(days.length === 0) return '';

  let run = 0;
  const pts = days.map(d => { run += map[d].i - map[d].x; return {d, v: run, day: map[d]}; });

  const H = 132, TOP = 22, BOT = 34, STEP = 52;
  const width = Math.max(pts.length * STEP + 30, 300);
  const hi = Math.max(0, ...pts.map(p=>p.v));
  const lo = Math.min(0, ...pts.map(p=>p.v));
  const span = (hi - lo) || 1;
  const y = v => TOP + H - (v - lo) / span * H;
  const x = k => 22 + k * STEP;
  const zero = y(0);

  let poly = pts.map((p,k)=> x(k)+','+y(p.v)).join(' ');
  const areaUp = 'M'+x(0)+','+zero+' L'+poly.split(' ').join(' L')+' L'+x(pts.length-1)+','+zero+' Z';

  let dots = '', labels = '';
  pts.forEach((p,k)=>{
    const py = y(p.v);
    dots += '<circle cx="'+x(k)+'" cy="'+py+'" r="3.5" fill="'+(p.v<0?'#B33A2B':'#2F6B4F')+'"></circle>';
    labels += '<text x="'+x(k)+'" y="'+(TOP+H+16)+'" font-size="10" fill="#6C7A80" text-anchor="middle">'
      + p.d.slice(5).replace('-','/') + '</text>';
    const flow = p.day.i - p.day.x;
    labels += '<text x="'+x(k)+'" y="'+(TOP+H+29)+'" font-size="9.5" text-anchor="middle" fill="'
      + (flow<0?'#B33A2B':'#2A5F7A')+'">'+(flow>0?'+':'')+group(Math.round(flow/1000))+'к</text>';
  });

  const last = pts[pts.length-1].v;
  return '<div class="chartbox"><div class="chartttl">Мөнгөн урсгал (хуримтлагдсан)'
    + '<span style="float:right;color:'+(last<0?'#B33A2B':'#2F6B4F')+'">'+fmt(last)+'</span></div>'
    + '<div class="chartscroll"><svg width="'+width+'" height="'+(TOP+H+BOT)+'" viewBox="0 0 '+width+' '+(TOP+H+BOT)+'">'
    + '<defs>'
    + '<clipPath id="up"><rect x="0" y="0" width="'+width+'" height="'+zero+'"></rect></clipPath>'
    + '<clipPath id="dn"><rect x="0" y="'+zero+'" width="'+width+'" height="'+(TOP+H-zero+2)+'"></rect></clipPath>'
    + '</defs>'
    + '<path d="'+areaUp+'" fill="#2F6B4F" opacity=".14" clip-path="url(#up)"></path>'
    + '<path d="'+areaUp+'" fill="#B33A2B" opacity=".14" clip-path="url(#dn)"></path>'
    + '<line x1="6" y1="'+zero+'" x2="'+(width-6)+'" y2="'+zero+'" stroke="#B9C2BA" stroke-dasharray="3 3"></line>'
    + '<text x="8" y="'+(zero-5)+'" font-size="9.5" fill="#9AA5A9">0</text>'
    + '<polyline points="'+poly+'" fill="none" stroke="#1B2A33" stroke-width="2" '
    + 'stroke-linejoin="round" stroke-linecap="round"></polyline>'
    + dots + labels + '</svg></div>'
    + (pts.length > 6 ? '<div class="legend" style="padding-top:4px">← Өмнөх өдрүүдийг харахын тулд баруунаас зүүн тийш гүйлгэнэ</div>' : '')
    + '<div class="legend"><span>Шугам: тухайн өдрийн эцсийн үлдэгдэл</span>'
    + '<span>Доор: тухайн өдрийн цэвэр урсгал (мянгаар)</span></div></div>';
}

    h += '<div class="warn" style="margin:0 0 12px">Сервертэй холбогдоход алдаа: '+esc(syncErr)+'</div>';
  }

  if(tab === 'sum'){
    h += '<div class="tiles">' + tile('Гэрээний үлдэгдэл', j.contract - s, wd) + tile('Бэлэн мөнгө', e - s, wd) + '</div>';
    h += statusAlert(j);
    h += progressCard(j);
    h += chartSvg(j);
    h += factsCard(j);
    h += catSect(j);
    h += settingsCard(j);
    h += (ui.jDel ? confirmBox('Энэ ажлыг бүх бичилттэй нь устгах уу?', 'delJob()')
        : '<button class="danger" onclick="ui={jDel:1};render()">Энэ ажлыг устгах</button>');
    return h;
  }

  if(tab !== 'plan' && tab !== 'asset') h += '<div class="card" style="margin-bottom:14px">';

  if(tab === 'plan'){
    const P = j.plan||[];
    const used = P.reduce((t,x)=>t+taskUsed(j,x.id),0);
    h += '<div class="note" style="padding:0 2px 10px">Гүйцэтгэх ажлуудаа хоногоор төлөвлөнө. '
      + 'Ирц бүртгэхэд эдгээрээс сонгоно.</div>';

    const pr = jobProgress(j);
    h += '<div class="pairs" style="margin:0 0 10px">'
      + '<div class="pair"><div class="plabel">Нийт гүйцэтгэл</div>'
      + '<div class="pval" style="color:var(--blue)">'+Math.round(pr)+'%</div></div>'
      + '<div class="pair"><div class="plabel">Зарцуулсан хүн өдөр</div>'
      + '<div class="pval" style="color:var(--ink)">'+nd(used)+'</div></div></div>'
      + '<div class="fc" style="color:var(--muted);margin:0 2px 12px">'
      + nd(Math.round(earnedDays(j)*10)/10)+' / '+nd(planDays(j))+' хоногийн ажил хийгдсэн'
      + (pr>0 && used>0 ? ' · энэ хурдаар дуустал нийт ≈ '+nd(Math.round(used/pr*100))+' хүн өдөр' : '')
      + '</div>';

    h += '<div class="card">';
    if(P.length === 0){
      h += '<div class="note" style="padding:0">Төлөвлөгөө оруулаагүй байна.</div>';
    } else {
      P.forEach(t => {
        if(ui.tEdit === t.id){
          h += '<div class="inf" style="margin:8px 0">'
            + '<input id="teName" placeholder="Ажлын нэр" value="'+esc(t.name)+'">'
            + '<input id="teDays" inputmode="decimal" placeholder="Төлөвлөсөн хоног" value="'+(t.days||'')+'">'
            + '<div class="btns"><button class="btn" onclick="saveTask(\''+t.id+'\')">Хадгалах</button>'
            + '<button class="btn ghost" onclick="ui={};render()">Болих</button></div></div>';
          return;
        }
        const u = taskUsed(j, t.id), tp = taskPct(t);
        const wgt = planDays(j) ? (t.days||0)/planDays(j)*100 : 0;
        h += '<div style="padding:12px 0;border-bottom:1px solid #EFF2EE">'
          + '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">'
          + '<div style="min-width:0;flex:1">'
          + '<div style="font-size:15px;font-weight:500">'+esc(t.name)
          + (t.done ? '<span class="tag" style="background:#E4EAE6;color:var(--good)">дууссан</span>' : '')+'</div>'
          + '<div class="rdate">'+nd(t.days||0)+' хоног · жин '+Math.round(wgt)+'% · '+nd(u)+' хүн өдөр зарцуулсан</div>'
          + '</div><button class="x" aria-label="Устгах" style="margin:-8px -8px 0 0" onclick="delTask(\''+t.id+'\')">×</button></div>'
          + '<div style="display:flex;align-items:center;gap:10px;margin-top:8px">'
          + '<input type="range" min="0" max="100" step="5" value="'+tp+'"'+(t.done?' disabled':'')
          + ' oninput="document.getElementById(\'tp'+t.id+'\').textContent=this.value+\'%\'"'
          + ' onchange="setTaskPct(\''+t.id+'\',this.value)" style="flex:1">'
          + '<b id="tp'+t.id+'" style="font-size:14px;color:'+(tp>=100?'var(--good)':'var(--blue)')
          + ';width:42px;text-align:right">'+tp+'%</b></div>'
          + '<div class="tbar"><i style="width:'+tp+'%;background:'+(tp>=100?'var(--good)':'var(--blue)')+'"></i></div>'
          + '<div style="display:flex;gap:7px;margin-top:10px">'
          + '<button class="small" onclick="toggleTask(\''+t.id+'\')">'+(t.done?'Нээх':'Дуусгах')+'</button>'
          + '<button class="small" onclick="ui={tEdit:\''+t.id+'\'};render()">Засах</button></div>'
          + '</div>';
      });
    }
    h += '</div>';

    if(ui.tAdd){
      h += '<div class="inf" style="margin-top:10px">'
        + '<input id="tnName" placeholder="Гүйцэтгэх ажлын нэр">'
        + '<input id="tnDays" inputmode="decimal" placeholder="Төлөвлөсөн хоног">'
        + '<div class="btns"><button class="btn" onclick="addTask()">Нэмэх</button>'
        + '<button class="btn ghost" onclick="ui={};render()">Болих</button></div></div>';
    } else {
      h += '<button class="btn" style="margin-top:10px" onclick="ui={tAdd:1};render()">+ Ажил нэмэх</button>';
    }

    return h;
  }

  if(tab === 'labor'){
    const L = (j.labor||[]).slice().sort((a,b)=> a.date<b.date?1:-1);
    const dayCount = new Set(L.map(x=>x.date)).size;
    const W = j.workers||[];
    const P = (j.plan||[]).filter(t=>!t.done);
    const acc = wageAccrued(j), paid = wagePaid(j);

    // ирц бүртгэх
    if(W.length === 0){
      h += '<div class="note" style="padding:0 2px 10px">Эхлээд ажилтнаа нэмнэ үү.</div></div>';
    } else if((j.plan||[]).length === 0){
      h += '<div class="note" style="padding:0 2px 10px">Эхлээд "Төлөвлөгөө" хэсэгт гүйцэтгэх ажлаа оруулна уу. '
        + 'Ирцийг тэр ажлуудад хуваарилна.</div></div>';
    } else {
      const TL = P.length ? P : j.plan;
      if(!TL.some(x=>x.id===lastT)) lastT = TL[0].id;
      if(!lastD) lastD = today();
      const marked = {};
      (j.labor||[]).forEach(e => { if(e.taskId===lastT && e.date===lastD) marked[e.workerId] = 1; });
      const nMark = Object.keys(marked).length;

      h += '<select id="lTask" class="wsel" onchange="lastT=this.value;render()">'
        + TL.map(t=>'<option value="'+t.id+'"'+(t.id===lastT?' selected':'')+'>'+esc(t.name)+'</option>').join('')
        + '</select>'
        + '<input id="eDate" type="date" value="'+lastD+'" onchange="lastD=this.value;render()" style="margin:8px 0 2px">'
        + '<div class="rdate" style="margin:6px 0 2px">Энэ өдөр ажилласан хүмүүсээ тэмдэглэнэ үү. '
        + 'Нэг хүний нэг өдөр = 1 хүн өдөр, 1 өдрийн цалин — хэдэн ажил дээр ажилласан нь '
        + 'ажлууд хооронд хуваагдан бодогдоно.</div>'
        + '<div style="margin-bottom:10px">'
        + W.map(w => '<label class="wrow'+(marked[w.id]?' has':'')+'">'
            + '<input type="checkbox" class="wchk" value="'+w.id+'"'+(marked[w.id]?' checked':'')+'>'
            + '<span class="nm">'+esc(w.name)
            + (w.role ? '<span class="rl"> · '+esc(w.role)+'</span>' : '')+'</span>'
            + '<span class="rl">'+fmt(w.rate)+'</span></label>').join('')
        + '</div>'
        + '<button class="btn" onclick="saveAttend()">'
        + (nMark ? 'Ирц шинэчлэх' : 'Ирц бүртгэх')+'</button></div>';
    }

    // нэгдсэн тоо
    h += '<div class="pairs" style="margin:0 0 10px">'
      + '<div class="pair"><div class="plabel">Нийт ажилласан өдөр</div>'
      + '<div class="pval" style="color:var(--blue)">'+dayCount+'</div></div>'
      + '<div class="pair"><div class="plabel">Нийт хүн өдөр</div>'
      + '<div class="pval" style="color:var(--blue)">'+nd(manDays(j))+'</div></div></div>'
      + '<div class="pairs" style="margin:0 0 14px">'
      + '<div class="pair"><div class="plabel">Ногдсон цалин</div>'
      + '<div class="pval" style="color:var(--ink)">'+fmt(acc)+'</div></div>'
      + '<div class="pair"><div class="plabel">Олгоогүй үлдэгдэл</div>'
      + '<div class="pval '+(acc-paid>0?'neg':'pos')+'">'+fmt(acc-paid)+'</div></div></div>'
      + '<div class="fc" style="color:var(--muted);margin:0 2px 14px">Олгосон цалин '+fmt(paid)
      + (bonusTotal(j)>0 ? ' · Урамшуулал '+fmt(bonusTotal(j)) : '')
      + ' — зардалд автоматаар бүртгэгдсэн.</div>';

    // албан тушаалаар
    const byRole = {};
    W.forEach(w => {
      const r = w.role || 'Тодорхойгүй';
      const d = wkDays(j, w.id);
      if(!byRole[r]) byRole[r] = {days:0, n:0, wage:0};
      byRole[r].days += d; byRole[r].n++; byRole[r].wage += d * w.rate;
    });
    const roleRows = Object.keys(byRole).map(k=>({k, d:byRole[k].days, n:byRole[k].n, wg:byRole[k].wage}))
      .sort((a,b)=>b.d-a.d);
    if(roleRows.some(r=>r.d>0)){
      const mx = Math.max.apply(null, roleRows.map(r=>r.d));
      h += '<div class="card" style="margin-bottom:10px"><div style="font-weight:600;margin-bottom:10px">Албан тушаалаар</div>';
      roleRows.forEach(r => {
        h += '<div style="margin-bottom:11px">'
          + '<div style="display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px">'
          + '<span>'+esc(r.k)+' <span style="color:var(--muted);font-size:12.5px">· '+r.n+' хүн</span></span>'
          + '<span style="font-weight:600;white-space:nowrap">'+nd(r.d)+' хүн өдөр</span></div>'
          + '<div style="height:6px;background:var(--track);border-radius:4px;overflow:hidden">'
          + '<i style="display:block;height:100%;width:'+(mx?r.d/mx*100:0)+'%;background:var(--blue)"></i></div>'
          + '<div style="font-size:12px;color:var(--muted);margin-top:4px">Ногдсон цалин '+fmt(r.wg)+'</div></div>';
      });
      h += '</div>';
    }

    // ажилчид — хураангуй
    h += '<div class="sect"><button class="hd" onclick="openW=!openW;render()">'
      + '<span>Ажилчид <span class="cnt">· '+W.length+' хүн</span></span>'
      + '<span class="arw'+(openW?' op':'')+'">›</span></button>';
    if(openW){
      h += '<div class="bd">';
      if(W.length === 0 && !ui.wAdd) h += '<div class="note" style="padding:0 0 10px">Ажилтан нэмээгүй байна.</div>';
      W.forEach(w => {
        if(ui.wEdit === w.id){
          h += wForm('we', w.name, w.rate, 'Хадгалах', "saveWorkerEdit('"+w.id+"')", w.role);
          return;
        }
        const d = wkDays(j,w.id), pd = wkPaidDays(j,w.id), due = wkDue(j,w), bn = wkBonus(j,w.id);
        const pend = w.lead ? leadShare(j, w.id) : 0;
        h += '<div style="padding:12px 0;border-bottom:1px solid #EFF2EE">'
          + '<div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">'
          + '<span style="font-weight:600;font-size:15.5px">'+esc(w.name)
          + (w.role ? '<span class="tag" style="background:#E6ECEF;color:var(--blue)">'+esc(w.role)+'</span>' : '')
          + (w.lead ? '<span class="lead">удирдагч</span>' : '')+'</span>'
          + '<span style="font-size:12.5px;color:var(--muted)">'+fmt(w.rate)+' / өдөр</span></div>'
          + '<div class="sub" style="margin:7px 0 10px">Ажилласан '+nd(d)+' өдөр · Олгосон '+nd(pd)
          + ' өдөр · Олгоогүй цалин <b style="color:'+(due>0?'var(--bad)':'var(--good)')+'">'+fmt(due)+'</b>'
          + (pend>0 ? '<br>Ногдох ашгийн урамшуулал: <b style="color:var(--good)">'+fmt(pend)+'</b>' : '')
          + (bn>0 ? '<br>Олгосон урамшуулал: <b>'+fmt(bn)+'</b>' : '')+'</div>'
          + '<div style="display:flex;gap:7px;flex-wrap:wrap">'
          + '<button class="small" onclick="openCal(\''+w.id+'\')">Ирц</button>'
          + (isAdmin()
              ? '<button class="small"'+(w.lead?' style="border-color:#BBD4C4;color:var(--good)"':'')
                + ' onclick="toggleLead(\''+w.id+'\')">'+(w.lead?'Удирдагч ✓':'Удирдагч болгох')+'</button>'
              : '')
          + '<button class="small" onclick="ui={wEdit:\''+w.id+'\'};render()">Засах</button>'
          + '<button class="small warn" onclick="ui={wDel:\''+w.id+'\'};render()">Устгах</button></div>';

        if(ui.cal && ui.cal.wid === w.id) h += calendarBox(j, w);
        if(ui.wDel === w.id){
          h += confirmBox(esc(w.name)+' — ирцийн бичилттэй нь устгах уу? Олгосон цалин зардалд үлдэнэ.',
                          "delWorker('"+w.id+"')");
        }
        h += '</div>';
      });

      if(ui.wAdd){
        h += wForm('wa', '', 0, 'Нэмэх', 'addWorker()');
      } else {
        const inJob = r => W.some(w => w.rid === r.id || w.name === r.name);
        const nLeft = roster.filter(r => !inJob(r)).length;
        h += '<div style="display:flex;gap:8px;margin:12px 0 0">'
          + '<button class="btn ghost" style="flex:1" onclick="ui={wAdd:1};render()">+ Шинэ ажилтан</button>'
          + '<button class="btn ghost" style="flex:1" onclick="pickOpen=!pickOpen;render()">'
          + (pickOpen ? 'Хаах' : 'Жагсаалтаас дуудах')+'</button></div>';
        if(pickOpen){
          h += '<div style="margin-top:10px">';
          if(roster.length === 0){
            h += '<div class="note" style="padding:0">Ажилчдын жагсаалт хоосон байна. Нүүр хуудасны "Ажилчид" цэснээс нэмнэ үү.</div>';
          } else {
            h += '<div class="rdate" style="margin-bottom:4px">'
              + (nLeft ? 'Нэмэх ажилтнаа дарна. Жагсаалт хаагдахгүй — дараалан нэмж болно.'
                       : 'Жагсаалтын бүх ажилтан энэ ажилд нэмэгдсэн байна.')
              + ' · ' + (roster.length - nLeft) + '/' + roster.length + ' нэмэгдсэн</div>';
            const ord = roster.slice().sort((a,b) => (inJob(a)?1:0) - (inJob(b)?1:0));
            ord.forEach(r => {
              const on = inJob(r);
              h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;'
                + 'padding:10px 0;border-bottom:1px solid #EFF2EE'+(on?';opacity:.55':'')+'">'
                + '<div style="min-width:0"><div style="font-size:15px;font-weight:500;overflow:hidden;'
                + 'text-overflow:ellipsis;white-space:nowrap">'+esc(r.name)+'</div>'
                + '<div class="rdate">'+(r.role?esc(r.role)+' · ':'')+fmt(r.rate)+' / өдөр</div></div>'
                + (on
                    ? '<span class="small" style="flex:none;border-color:#BBD4C4;color:var(--good);'
                      + 'pointer-events:none">✓ Нэмэгдсэн</span>'
                    : '<button class="small" style="flex:none" onclick="importWorker(\''+r.id+'\')">'
                      + 'Нэмэх</button>')
                + '</div>';
            });
          }
          h += '</div>';
        }
      }
      h += '</div>';
    }
    h += '</div>';

    h += bonusBox(j, W);

    return h;
  }

  if(tab === 'asset'){
    h += '<div class="note" style="padding:0">Зардал бүртгэхдээ тэмдэглэсэн хөрөнгө энд цугларна. Гэмтсэн зүйлээ "Хасах" дарж актална.</div>';
    const list = assets(j).slice().sort((a,b)=> a.date<b.date?1:-1);
    h += '<div class="total"><span>Нийт үндсэн хөрөнгө</span><b>'+fmt(av)+'</b></div>';
    if(list.length===0){
      h += '<div class="note">Үндсэн хөрөнгө бүртгээгүй байна.</div>';
    } else {
      list.forEach(it=>{
        h += '<div class="row asset"><div style="min-width:0"><div class="rdesc">'+esc(it.desc)+'</div>'
          + '<div class="rdate">'+it.date+'</div></div>'
          + '<div style="display:flex;align-items:center;gap:9px">'
          + '<span class="ramt">'+fmt(it.amount)+'</span>'
          + '<button class="small warn" onclick="ui={off:\''+it.id+'\'};render()">Хасах</button>'
          + '</div></div>'
          + (ui.off === it.id ? '<div class="inf">'
              + '<input id="offNote" placeholder="Шалтгаан" value="Гэмтсэн">'
              + '<div class="btns"><button class="btn" onclick="writeOff(\''+j.id+'\',\''+it.id+'\')">Хасах</button>'
              + '<button class="btn ghost" onclick="ui={};render()">Болих</button></div></div>' : '');
      });
    }
    return h;
  }

  const isExp = tab === 'exp';
  h += '<h2 style="margin:0;font-size:15.5px;font-weight:700">'+(isExp ? 'Шинэ зардал' : 'Шинэ орлого')+'</h2>'
    + '<label class="fl" for="eDesc">'+(isExp ? 'Юунд' : 'Ямар төлбөр')+'</label>'
    + '<input id="eDesc" placeholder="'+(isExp ? 'Жишээ: Кабель АС-70' : 'Жишээ: Урьдчилгаа')+'">'
    + '<div style="display:flex;gap:10px">'
    + '<div style="flex:1;min-width:0"><label class="fl" for="eAmt">Дүн (₮)</label>'
    + '<input id="eAmt" placeholder="0" inputmode="numeric" oninput="liveNum(this)"></div>'
    + '<div style="flex:1;min-width:0"><label class="fl" for="eDate">Огноо</label>'
    + '<input id="eDate" type="date" value="'+today()+'"></div></div>';
  if(isExp){
    if(selCat === 'wage') selCat = 'mat';
    h += '<div class="fl">Ангилал</div><div class="chips">' + CATS.filter(c => c.k !== 'wage').map(c =>
        '<button class="chip'+(c.k===selCat?' on':'')+'" onclick="pickCat(this,\''+c.k+'\')">'
        + '<i class="cd" style="background:'+c.c+'"></i>'+c.t+'</button>'
      ).join('') + '</div>'
      + '<label class="check" style="min-height:40px"><input type="checkbox" id="eAsset">Үндсэн хөрөнгө болж үлдэнэ</label>';
  }
  h += '<button class="btn '+(isExp ? '' : 'blue')+'" style="min-height:48px;margin-top:'+(isExp ? '0' : '14px')+'" onclick="addEntry()">'
    + (isExp ? 'Зардал нэмэх' : 'Орлого нэмэх')+'</button></div>';

  let list = (isExp ? j.expenses : j.incomes).slice().sort((a,b)=> a.date<b.date?1:-1);
  const allTot = list.reduce((t,x)=>t+x.amount, 0);
  const bonIds = {};
  (j.bonuses||[]).forEach(b => { if(b.expenseId) bonIds[b.expenseId] = 1; });

  h += '<div class="lhd"><h2>'+(isExp ? 'Зардлууд' : 'Орлогууд')+'</h2>'
    + '<span>'+list.length+' бичилт · <b>'+fmt(allTot)+'</b></span></div>';

  if(isExp && list.length > 0){
    const keys = [];
    CATS.forEach(c => {
      const v = list.filter(e => catOf(e.cat).k === c.k && !(c.k==='wage' && bonIds[e.id]))
        .reduce((t,e)=>t+e.amount, 0);
      if(v > 0) keys.push({k:c.k, t:c.t, c:c.c, v:v});
    });
    const bv = list.filter(e => bonIds[e.id]).reduce((t,e)=>t+e.amount, 0);
    if(bv > 0) keys.push({k:'__bon', t:'Урамшуулал', c:'#8A6A1F', v:bv});

    if(keys.length > 1){
      if(!keys.some(x=>x.k===expFilter)) expFilter = '';
      h += '<div class="fchips">'
        + '<button class="fchip'+(expFilter===''?' on':'')+'" onclick="expFilter=\'\';render()">Бүгд</button>'
        + keys.map(x => '<button class="fchip'+(expFilter===x.k?' on':'')
            + '" onclick="expFilter=\''+x.k+'\';render()"><i style="background:'+x.c+'"></i>'+x.t+'</button>').join('')
        + '</div>';
    }
    if(expFilter){
      list = expFilter === '__bon'
        ? list.filter(e => bonIds[e.id])
        : list.filter(e => catOf(e.cat).k === expFilter && !(expFilter==='wage' && bonIds[e.id]));
      const sub = list.reduce((t,e)=>t+e.amount, 0);
      const nm = (keys.find(x=>x.k===expFilter)||{}).t || '';
      h += '<div class="total" style="padding:11px 13px;margin-bottom:10px">'
        + '<span style="font-size:13.5px">'+esc(nm)+' · '+list.length+' бичилт</span>'
        + '<b style="font-size:16px">'+fmt(sub)+'</b></div>';
    }
  }

  if(list.length===0){

function typeTag(j){

const movedQty = it => (it.moves||[]).reduce((t,m)=>t+(m.qty||0), 0);
const stockLeft = it => Math.max(0, (it.qty||0) - movedQty(it));
const mvCost = (it, m) => (m && m.cost !== undefined && m.cost !== null) ? m.cost : (it.cost||0);
const stockProfit = it => (it.moves||[]).reduce((t,m)=>t+((m.price||0)-mvCost(it,m))*(m.qty||0), 0);
const stockSold = it => (it.moves||[]).reduce((t,m)=>t+(m.price||0)*(m.qty||0), 0);
const stockSBon = it => (it.moves||[]).reduce((t,m)=>t+(m.sbon||0), 0);
// борлуулагчтай бол зарсан дүнгийн pct% компанид, ашгийн үлдсэн хэсэг борлуулагчид
function mvSplit(q, pr, cost, pct){
  const sale = q*pr, margin = (pr - cost)*q;
  if(pct === null || pct === undefined) return {sale: sale, margin: margin, co: margin, sb: 0};
  const coMin = sale * pct / 100;
  const sb = margin > coMin ? Math.round(margin - coMin) : 0;
  return {sale: sale, margin: margin, co: margin - sb, sb: sb};
}
const matEarnedOf = r => stock.reduce((t,it) => t + (it.moves||[]).filter(m=>m.seller===r.id)
  .reduce((u,m)=>u+(m.sbon||0), 0), 0);
const matPaidOf = r => (r.mpays||[]).reduce((t,p)=>t+(p.amount||0), 0);
const matDueOf = r => Math.max(0, matEarnedOf(r) - matPaidOf(r));

}

function addStock(){
  const name = (document.getElementById('snName')||{}).value.trim();
  const q = parseFloat(String((document.getElementById('snQty')||{}).value||'').replace(',','.'));
  const c = num((document.getElementById('snCost')||{}).value||'') || 0;
  if(!name){ alert('Нэрээ оруулна уу.'); return; }
  if(!(q > 0)){ alert('Ширхэгийн тоог оруулна уу.'); return; }
  const b = readSup('sn');
  const it = {id: uid(), name: name, qty: q, cost: c, moves: [], buys: [], owner: admin||me};
  const sid = b.name ? supIdOf(b.name) : '';
  it.buys.push({id: uid(), date: b.date, qty: q, cost: c, sup: sid});
  if(sid && b.paid && q*c > 0) payTo(sid, q*c, b.date, name, [{item: it.id, amt: q*c}]);
  stock.push(it);
  saveStock(); saveSup(); ui = {}; render();
}

function saveStockItem(id){
  const it = stock.find(x=>x.id===id); if(!it) return;
  const name = (document.getElementById('seName')||{}).value.trim();
  const q = parseFloat(String((document.getElementById('seQty')||{}).value||'').replace(',','.'));
  const c = num((document.getElementById('seCost')||{}).value||'');
  if(name) it.name = name;
  if(q >= 0) it.qty = q;
  if(c >= 0) it.cost = c;
  saveStock(); ui = {}; render();
}

function delStock(id){
  stock = stock.filter(x=>x.id!==id);
  saveStock(); ui = {}; render();
}

function doMove(id, kind){
  const it = stock.find(x=>x.id===id); if(!it) return;
  const q = parseFloat(String((document.getElementById('mvQty')||{}).value||'').replace(',','.'));
  const pr = num((document.getElementById('mvPrice')||{}).value||'');
  const dt = (document.getElementById('mvDate')||{}).value || today();
  if(!(q > 0)){ alert('Ширхэгийн тоог оруулна уу.'); return; }
  if(q > stockLeft(it)){ alert('Үлдэгдлээс их байна. Үлдэгдэл '+nd(stockLeft(it))+' ш.'); return; }
  if(!(pr > 0)){ alert('Нэгж үнийг оруулна уу.'); return; }

  const seller = ((document.getElementById('mvSeller')||{}).value || '');
  let pct = null;
  if(seller){
    const pEl = document.getElementById('mvPct');
    pct = (pEl && isAdmin()) ? pctOf(pEl.value) : curMatPct();
  }
  const sp = mvSplit(q, pr, it.cost||0, pct);
  const sx = seller ? {seller: seller, pct: pct, sbon: sp.sb} : {};
  lastSeller = seller;

  let jobId = '';
  if(kind === 'job'){
    jobId = (document.getElementById('mvJob')||{}).value || '';
    const j = jobs.find(x=>x.id===jobId);
    if(!j){ alert('Ажлаа сонгоно уу.'); return; }
    setMatJob(jobId);
    const eid = uid();
    j.expenses.push({id: eid, desc: 'Материал \u2014 '+it.name+' ('+nd(q)+' ш × '+fmt(pr)+')',
      amount: q*pr, date: dt, cat: 'mat', asset: false, by: me||''});
    it.moves = it.moves || [];
    it.moves.push(Object.assign({id: uid(), type:'job', qty: q, price: pr, cost: it.cost||0, date: dt, jobId: jobId, expenseId: eid}, sx));
    save();
  } else {
    it.moves = it.moves || [];
    it.moves.push(Object.assign({id: uid(), type:'sell', qty: q, price: pr, cost: it.cost||0, date: dt}, sx));
  }
  saveStock(); ui = {}; render();
}

function delMove(id, mid, force){
  const it = stock.find(x=>x.id===id); if(!it) return;
  const m = (it.moves||[]).find(x=>x.id===mid);
  if(!force && m && m.seller && (m.sbon||0) > 0){
    const r = roster.find(x=>x.id===m.seller);
    if(r && matPaidOf(r) > matEarnedOf(r) - m.sbon + 0.5){ ui.mvDel = mid; render(); return; }
  }
  if(ui.mvDel) delete ui.mvDel;
  if(m && m.jobId && m.expenseId){
    const j = jobs.find(x=>x.id===m.jobId);
    if(j){ j.expenses = j.expenses.filter(e=>e.id!==m.expenseId); save(); }
  }
  it.moves = (it.moves||[]).filter(x=>x.id!==mid);
  saveStock(); render();
}

function rosterJobs(r){
  const out = [];
  jobs.forEach(j => {
    const w = (j.workers||[]).find(x => x.rid === r.id || x.name === r.name);
    if(!w) return;
    const d = wkDays(j, w.id), pd = wkPaidDays(j, w.id);
    out.push({j:j, w:w, days:d, paid:pd, left:d-pd, due:Math.max(0,(d-pd)*w.rate),
      bon: (w.lead && j.done) ? leadShare(j, w.id) : 0});
  });
  return out;
}
