function paidHistBox(r){
  const rows = [];
  jobs.forEach(j => {
    const w = (j.workers||[]).find(x => x.rid === r.id || x.name === r.name);
    if(!w) return;
    const wage = (j.wagePays||[]).filter(p=>p.workerId===w.id);
    const bons = (j.bonuses||[]).filter(b=>b.workerId===w.id);
    const wa = wage.reduce((s,p)=>s+p.amount, 0);
    const ba = bons.reduce((s,b)=>s+b.amount, 0);
    if(wa <= 0 && ba <= 0) return;
    const dates = wage.concat(bons).map(x=>x.date).filter(Boolean).sort();
    rows.push({name: j.name, wa: wa, ba: ba,
      days: wage.reduce((s,p)=>s+(p.days||0), 0),
      last: dates.length ? dates[dates.length-1] : ''});
  });
  const mp = canMat() ? matPaidOf(r) : 0;
  if(mp > 0){
    const ds = (r.mpays||[]).map(p=>p.date).filter(Boolean).sort();
    rows.push({name: 'Материалын борлуулалт', wa: 0, ba: mp, days: 0, last: ds.length ? ds[ds.length-1] : ''});
  }
  if(!rows.length){
    return '<div class="note" style="padding:0 0 10px">Олголт хийгдээгүй байна.</div>';
  }
  rows.sort((a,b)=>(b.wa+b.ba)-(a.wa+a.ba));
  const tW = rows.reduce((s,x)=>s+x.wa, 0), tB = rows.reduce((s,x)=>s+x.ba, 0);

  let h = '<div class="inf" style="margin:0 0 10px">'
    + '<div class="rdate" style="margin-bottom:6px">Ажил тус бүрээр олгосон дүн</div>';
  rows.forEach(x => {
    h += '<div style="padding:8px 0;border-bottom:1px solid #EFF2EE">'
      + '<div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">'
      + '<span style="font-size:14.5px;font-weight:500">'+esc(x.name)+'</span>'
      + '<b style="white-space:nowrap">'+fmt(x.wa + x.ba)+'</b></div>'
      + '<div class="rdate">'
      + (x.wa > 0 ? 'цалин '+fmt(x.wa)+(x.days>0?' ('+nd(x.days)+' өдөр)':'') : '')
      + (x.wa > 0 && x.ba > 0 ? ' · ' : '')
      + (x.ba > 0 ? 'урамшуулал '+fmt(x.ba) : '')
      + (x.last ? ' · сүүлд '+x.last : '')+'</div></div>';
  });
  h += '<div class="calc" style="margin:8px 0 0">'
    + (tW > 0 ? '<div class="ln"><span>Нийт цалин</span><b>'+fmt(tW)+'</b></div>' : '')
    + (tB > 0 ? '<div class="ln"><span>Нийт урамшуулал</span><b>'+fmt(tB)+'</b></div>' : '')
    + '<div class="ln tot"><span>Нийт авсан</span><b>'+fmt(tW + tB)+'</b></div></div></div>';
  return h;
}

function rosterStats(r){
  let days = 0, paid = 0, njobs = 0, due = 0, bonus = 0, bonDue = 0, open = [], lead = false;
  jobs.forEach(j => {
    const w = (j.workers||[]).find(x => x.rid === r.id || x.name === r.name);
    if(!w) return;
    njobs++;
    if(w.lead) lead = true;
    days += wkDays(j, w.id);
    paid += (j.wagePays||[]).filter(p=>p.workerId===w.id).reduce((s,p)=>s+p.amount,0);
    bonus += wkBonus(j, w.id);
    if(w.lead && j.done) bonDue += leadShare(j, w.id);
    const d = wkDue(j, w);
    due += d;
    if(d > 0) open.push({name: j.name, amt: d, days: wkDays(j,w.id) - wkPaidDays(j,w.id)});
  });
  // борлуулалтын урамшууллыг зөвхөн материалын эрхтэй хүн харна
  const mEarn = canMat() ? matEarnedOf(r) : 0, mPaid = canMat() ? matPaidOf(r) : 0;
  return {days, paid, njobs, due, bonus, bonDue, open, lead, mEarn: mEarn, mPaid: mPaid, mDue: Math.max(0, mEarn - mPaid)};
}

function rosterView(){
  const ST = {};
  roster.forEach(r => { ST[r.id] = rosterStats(r); });
  const owes = r => ST[r.id].due + ST[r.id].bonDue + ST[r.id].mDue > 0;
  const totalDue = roster.reduce((s,r)=>s+ST[r.id].due, 0);
  const nOwed = roster.filter(owes).length;

  let h = '<div class="sechd" style="margin-top:4px"><h2 style="font-size:22px">Ажилчид</h2>'
    + (isAdmin() && !ui.rAdd ? '<button class="btn sm" onclick="ui={rAdd:1};render()">'+IC.plus+'Ажилтан</button>' : '')
    + '</div>';
  if(ui.rAdd && isAdmin()) h += wForm('ra', '', 0, 'Нэмэх', 'addRoster()');

  if(roster.length > 0){
    h += '<div class="total" style="background:'+(totalDue>0?'#FBE9E6':'#E6F0EA')+'">'
      + '<span><span style="display:block;font-size:14px;font-weight:500">Нийт олгох цалин</span>'
      + (nOwed ? '<span class="rdate">'+nOwed+' хүнд</span>' : '')+'</span>'
      + '<b style="color:'+(totalDue>0?'var(--bad)':'var(--good)')+'">'+fmt(totalDue)+'</b></div>';
    if(roster.length > 4){
      h += '<label class="srch">'+IC.search
        + '<input type="search" placeholder="Нэрээр хайх" aria-label="Нэрээр хайх" oninput="filterRoster(this.value)"></label>';
    }
  }
  if(roster.length === 0 && !ui.rAdd){
    h += '<div class="empty">Ажилтан бүртгээгүй байна. Нэмсэн ажилтнаа дараа нь аль ч ажилд дуудаж оруулна.</div>';
  }

  const sorted = roster.slice().sort(function(a,b){
    return (ST[b.id].due + ST[b.id].bonDue + ST[b.id].mDue) - (ST[a.id].due + ST[a.id].bonDue + ST[a.id].mDue);
  });
  const busy = r => ui.rOpen===r.id || ui.rEdit===r.id || ui.rHist===r.id || ui.rDel===r.id
    || ui.rBon===r.id || ui.rPay===r.id || ui.rMenu===r.id;
  const top = sorted.filter(owes), rest = sorted.filter(r => !owes(r));
  top.forEach(r => { h += rCard(r, ST[r.id]); });
  if(rest.length){
    if(top.length) h += '<div class="secttl" style="margin:16px 2px 8px">Олгох цалингүй</div>';
    rest.forEach(r => { h += busy(r) ? rCard(r, ST[r.id]) : rMini(r); });
  }

  if(!isAdmin()){
    h += '<div class="note" style="margin-top:10px">Энэ жагсаалтыг зөвхөн эзэн нь удирдана. Ажил дээрээ эндээс ажилтан сонгон нэмж болно.</div>';
  }
  return h;
}

  if(rr.id && matDueOf(rr) > 0) pick.__mat = 1;
  ui = {rPay: rid, pick: pick, amt: {}};
  render();
}

function openRBon(rid){

// нэг ажлын олголтыг цалин ба урамшуулалд хуваана (эхлээд цалин)
function payAlloc(x){
  const on = !!(ui.pick && ui.pick[x.j.id]);
  const max = x.due + x.bon;
  if(!on || max <= 0) return {amt:0, wage:0, bon:0, max:max};
  let v = (ui.amt && ui.amt[x.j.id] !== undefined) ? num(ui.amt[x.j.id]) : max;
  if(!(v > 0)) v = 0;
  const amt = Math.min(v, max);
  const wage = Math.min(amt, x.due);
  return {amt:amt, wage:wage, bon:amt - wage, max:max};
}

function matPayAmt(r){
  const md = matDueOf(r);
  const on = !!(ui.pick && ui.pick.__mat);
  if(!on || md <= 0) return {amt: 0, max: md};
  let v = (ui.amt && ui.amt.__mat !== undefined) ? num(ui.amt.__mat) : md;
  if(!(v > 0)) v = 0;
  return {amt: Math.min(v, md), max: md};
}

function setPayAmt(jid, el){
  ui.amt = ui.amt || {};
  ui.amt[jid] = el.value;
  render();
}

function payRosterWage(rid){
  const r = roster.find(x=>x.id===rid); if(!r) return;
  const dt = (document.getElementById('rpDate')||{}).value || today();
  const list = rosterJobs(r).filter(x => (x.due > 0 || x.bon > 0) && ui.pick && ui.pick[x.j.id]);
  const ma = matPayAmt(r);
  if(!list.length && !(ma.amt > 0)){ alert('Ажил сонгоно уу.'); return; }
  let any = false;
  if(ma.amt > 0){
    any = true;
    r.mpays = r.mpays || [];
    r.mpays.push({id: uid(), date: dt, amount: ma.amt, by: me||''});
    saveRoster();
  }
  list.forEach(x => {
    const a = payAlloc(x);
    if(a.wage > 0){
      any = true;
      const days = x.w.rate > 0 ? Math.round(a.wage / x.w.rate * 100) / 100 : x.left;
      const eid = uid();
      x.j.wagePays = x.j.wagePays || [];
      x.j.wagePays.push({id: uid(), workerId: x.w.id, days: days, amount: a.wage,
        date: dt, expenseId: eid});
      x.j.expenses.push({id: eid, desc: 'Цалин \u2014 '+x.w.name+' ('+nd(days)+' өдөр)',
        amount: a.wage, date: dt, cat: 'wage', asset: false});
    }
    if(a.bon > 0){
      any = true;
      const bid = uid();
      x.j.bonuses = x.j.bonuses || [];
      x.j.bonuses.push({id: uid(), workerId: x.w.id, amount: a.bon, note: 'Ашгийн урамшуулал',
        kind: 'profit', date: dt, expenseId: bid});
      x.j.expenses.push({id: bid, desc: 'Ашгийн урамшуулал \u2014 '+x.w.name
        + ' ('+nd(x.days)+' өдөр)', amount: a.bon, date: dt, cat: 'wage', asset: false});
    }
  });
  if(!any){ alert('Олгох дүнг оруулна уу.'); return; }
  save(); ui = {}; render();
}

function payRosterBonus(rid){
  const r = roster.find(x=>x.id===rid); if(!r) return;
  const amt = num((document.getElementById('rbAmt')||{}).value || '');
  if(!(amt > 0)){ alert('Дүнг оруулна уу.'); return; }
  const note = ((document.getElementById('rbNote')||{}).value || '').trim();
  const dt = (document.getElementById('rbDate')||{}).value || today();
  const list = rosterJobs(r).filter(x => x.days > 0 && ui.pick && ui.pick[x.j.id]);
  if(!list.length){ alert('Ажил сонгоно уу.'); return; }
  const totDays = list.reduce((s,x)=>s+x.days, 0);
  list.forEach(x => {
    const a = Math.round(amt * x.days / totDays);
    if(a <= 0) return;
    const eid = uid();
    x.j.bonuses = x.j.bonuses || [];
    x.j.bonuses.push({id: uid(), workerId: x.w.id, amount: a, note: note || 'Урамшуулал',
      date: dt, expenseId: eid});
    x.j.expenses.push({id: eid, desc: 'Урамшуулал \u2014 '+x.w.name+(note?' ('+note+')':''),
      amount: a, date: dt, cat: 'wage', asset: false});
  });
  save(); ui = {}; render();
}

function addRoster(){
  const name = document.getElementById('raName').value.trim();
  const r = num(document.getElementById('raRate').value) || 0;
  if(!name){ alert('Нэрээ оруулна уу.'); return; }
  roster.push({id: uid(), name, rate: r, role: (document.getElementById('raRole').value||'').trim(), owner: admin||me});
  saveRoster(); ui={}; render();
}

function saveRosterEdit(rid){
  const r = roster.find(x=>x.id===rid); if(!r) return;
  const name = document.getElementById('reName').value.trim();
  const v = num(document.getElementById('reRate').value);
  if(name) r.name = name;
  if(v>=0) r.rate = v;
  r.role = document.getElementById('reRole').value.trim();
  saveRoster(); ui={}; render();
}

function delRoster(rid){
  roster = roster.filter(x=>x.id!==rid);
  saveRoster(); ui={}; render();
}

function rosterAdd(name, rate, role){
  if(!isAdmin()) return null;
  const hit = roster.find(r => r.name.toLowerCase() === name.toLowerCase());
  if(hit) return hit.id;
  const r = {id: uid(), name, rate, role: role||'', owner: admin||me};
  roster.push(r); saveRoster();
  return r.id;
}

function importWorker(rid){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const r = roster.find(x=>x.id===rid); if(!r) return;
  j.workers = j.workers || [];
  if(j.workers.some(w => w.rid === r.id || w.name === r.name)){ render(); return; }
  j.workers.push({id: uid(), rid: r.id, name: r.name, rate: r.rate||0, role: r.role||''});
  save(); render();
}

  const dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  let lead = first.getUTCDay() - 1; if(lead < 0) lead = 6;   // Даваагаар эхэлнэ

  const ent = (j.labor||[]).filter(e => e.workerId === w.id && e.date.slice(0,7) === ym);
  const byDay = {};
  ent.forEach(e => { (byDay[+e.date.slice(8,10)] = byDay[+e.date.slice(8,10)] || []).push(e); });

  let h = '<div class="inf" style="margin:10px 0 0">'
    + '<div class="calhd"><button onclick="calMove(-1)">‹</button>'
    + '<span style="font-weight:600;font-size:14.5px">'+y+' · '+MONN[m-1]+'</span>'
    + '<button onclick="calMove(1)">›</button></div>'
    + '<div class="cal">'
    + ['Да','Мя','Лх','Пү','Ба','Бя','Ня'].map(d=>'<div class="wd">'+d+'</div>').join('');
  for(let i=0;i<lead;i++) h += '<div class="dy off"></div>';
  for(let d=1; d<=dim; d++){
    const ds = ym + '-' + String(d).padStart(2,'0');
    const on = byDay[d];
    h += '<button class="dy'+(on?' on':'')+(ds===today()?' tdy':'')+'" '
      + 'onclick="ui.calDay=\''+ds+'\';render()">'+d
      + (on && on.length>1 ? '<i>'+on.length+' ажил</i>' : '')+'</button>';
  }
  h += '</div><div class="rdate" style="text-align:center">Энэ сард '+ent.length+' өдөр ажилласан</div>';

  if(ui.calDay){
    const list = (j.labor||[]).filter(e => e.workerId === w.id && e.date === ui.calDay);
    h += '<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">'
      + '<div style="font-size:13.5px;font-weight:600;margin-bottom:6px">'+ui.calDay+'</div>';
    if(list.length === 0){
      h += '<div class="rdate">Энэ өдөр ирц бүртгэгдээгүй.</div>';
    } else {
      const share = 1 / list.length;
      list.forEach(e => {
        const t = taskOf(j, e.taskId);

          + '<span style="font-size:14px;min-width:0">'+esc(t ? t.name : 'Ажилласан')+'</span>'

    }
    h += '</div>';
  }
  return h + '</div>';
}

const gotProfitBonus = (j,wid) => (j.bonuses||[]).some(b => b.workerId===wid && b.kind==='profit');

// тухайн удирдагчид өмнө олгосон ашгийн урамшууллын нийлбэр
const paidProfit = (j,wid) => (j.bonuses||[])
  .filter(b => b.workerId===wid && b.kind==='profit')
  .reduce((t,b)=>t+(b.amount||0), 0);

function bonusCalc(j, Wall){
  const leads = (Wall || j.workers || []).filter(w => w.lead);
  const pct = j.coPct || 0;
  const cost = spent(j) + wageDue(j);
  const gross = j.contract - cost;
  const coShare = j.contract * pct / 100;
  const pool = gross - coShare;                       // одоо үлдсэн сан
  const paidTot = leads.reduce((t,w)=>t+paidProfit(j, w.id), 0);
  const grossPool = pool + paidTot;                   // олголтоос өмнөх бүтэн сан
  const active = leads.filter(w => wkDays(j, w.id) > 0);
  const totalDays = active.reduce((t,w)=>t+wkDays(j, w.id), 0);

  // ногдох дүн = бүтэн сангаас өдрөөр хувьчилсан дүн хасах өмнө авсан
  const shares = {};
  let want = 0;
  active.forEach(w => {
    const ent = totalDays > 0 ? grossPool * wkDays(j, w.id) / totalDays : 0;
    const v = Math.max(0, ent - paidProfit(j, w.id));
    shares[w.id] = v; want += v;
  });
  // үлдсэн сангаас хэтрэхгүй байхаар жигдрүүлнэ
  const cap = Math.max(0, pool);
  const k = (want > cap && want > 0) ? cap / want : 1;
  active.forEach(w => { shares[w.id] = Math.round(shares[w.id] * k); });

  const picked = active.filter(w => shares[w.id] > 0);
  const paidL = leads.filter(w => paidProfit(j, w.id) > 0 && !(shares[w.id] > 0));
  return {pct, cost, gross, coShare, pool, grossPool, paidTot, shares,
          leads, paidL, picked, totalDays};
}

// нэг удирдагчид ногдох ашгийн урамшуулал
function leadShare(j, wid){
  const c = bonusCalc(j, j.workers||[]);
  if(c.pool <= 0) return 0;
  return c.shares[wid] || 0;
}

function bonusBox(j, W){
  if(!isAdmin()) return '';
  const c = bonusCalc(j, W);
  let h = '<div class="sect"><button class="hd" onclick="openB=!openB;render()">'
    + '<span>Удирдагчдын ашгийн урамшуулал'
    + (c.pool > 0 ? ' <span class="cnt">· хуваарилах '+fmt(c.pool)+'</span>' : '')+'</span>'
    + '<span class="arw'+(openB?' op':'')+'">\u203A</span></button>';
  if(!openB) return h + '</div>';

  h += '<div class="bd">'
    + '<div class="mlabel" style="margin-bottom:6px">Компанийн ашиг (гэрээний дүнгээс %)</div>'
    + '<div style="display:flex;align-items:center;gap:10px">'
    + '<input type="range" min="0" max="60" step="1" value="'+c.pct+'" '
    + 'oninput="document.getElementById(\'coPv\').textContent=this.value+\'%\'" '
    + 'onchange="setCoPct(this.value)" style="flex:1">'
    + '<b id="coPv" style="font-size:15px;width:44px;text-align:right">'+c.pct+'%</b></div>'
    + ohHint(c.pct)
    + '<div class="calc">'
    + '<div class="ln"><span>Гэрээний дүн</span><b>'+fmt(j.contract)+'</b></div>'
    + '<div class="ln"><span>Нийт зардал</span><b>\u2212'+fmt(spent(j))+'</b></div>'
    + (wageDue(j) > 0 ? '<div class="ln"><span>Олгоогүй цалин</span><b>\u2212'+fmt(wageDue(j))+'</b></div>' : '')
    + '<div class="ln"><span>Үлдэх ашиг</span><b class="'+(c.gross<0?'neg':'pos')+'">'+fmt(c.gross)+'</b></div>'
    + '<div class="ln"><span>Компанийн ашиг ('+c.pct+'%)</span><b>\u2212'+fmt(c.coShare)+'</b></div>'
    + '<div class="ln tot"><span>Хуваарилах сан</span>'
    + '<b class="'+(c.pool<0?'neg':'pos')+'">'+fmt(c.pool)+'</b></div></div>';

  if(c.pool <= 0){
    return h + '<div class="warn" style="margin:0">Хуваарилах ашиг алга. Компанийн ашгийн хувийг '
      + 'бууруулах, эсвэл зардлаа хянах хэрэгтэй.</div></div></div>';
  }
  if(c.paidTot > 0){
    h += '<div class="rdate" style="margin:-4px 0 6px">Өмнө '+fmt(c.paidTot)
      + ' олгосон · нийт сан '+fmt(c.grossPool)+'.</div>';
  }
  if(c.leads.length === 0){
    return h + '<div class="note" style="padding:0">Удирдагч тэмдэглээгүй байна. Дээрх "Ажилчид" '
      + 'хэсгээс хүн бүр дээр "Удирдагч болгох" дарж тэмдэглэнэ үү.</div></div></div>';
  }

  h += '<div class="rdate" style="margin:2px 0 6px">Удирдагч бүрт ажилласан өдрийн тоогоор '
    + 'автоматаар хуваарилагдана. Энд зөвхөн тооцоо харагдана.</div>';

  c.leads.forEach(w => {
    const d = wkDays(j, w.id);
    const share = c.shares[w.id] || 0;
    const pd = paidProfit(j, w.id);
    const done = pd > 0 && share <= 0;
    h += '<div class="brow">'
      + '<span style="flex:1;min-width:0"><span style="font-size:15px">'+esc(w.name)+'</span>'
      + '<span class="rdate">'+nd(d)+' өдөр'
      + (c.totalDays ? ' \u00B7 '+Math.round(d/c.totalDays*100)+'%' : '')
      + (pd > 0 ? ' \u00B7 олгосон '+fmt(pd) : '')+'</span></span>'
      + '<b style="white-space:nowrap;color:'+(share>0?'var(--good)':'var(--muted)')+'">'
      + (done ? '\u2713' : (share>0 ? fmt(share) : '\u2014'))+'</b></div>';
  });

  if(c.totalDays > 0){
    h += j.done
      ? '<div class="okmsg" style="margin-top:10px">Ажил дууссан. Олголтыг нүүр хуудасны '
        + '"Ажилчид" цэснээс тухайн хүний цалинтай хамт хийнэ.</div>'
      : '<div class="warn" style="margin-top:10px">Энэ бол урьдчилсан тооцоо. Ажлыг '
        + '"Ажил дууссан" гэж тэмдэглэсний дараа "Ажилчид" цэснээс олгох боломжтой болно.</div>';
  } else if(c.paidL.length === c.leads.length && c.leads.length > 0){
    h += '<div class="okmsg" style="margin-top:10px">Бүх удирдагчид олгогдсон.</div>';
  } else {
    h += '<div class="note" style="padding:8px 0 0">Олгох урамшуулал алга.</div>';
  }
  return h + '</div></div>';
}

function setCoPct(v){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  j.coPct = Math.max(0, Math.min(100, parseInt(v,10)||0));
  save(); render();
}

function toggleLead(wid){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const w = (j.workers||[]).find(x=>x.id===wid); if(!w) return;
  if(w.lead){ delete w.lead; delete bonPick[wid]; } else w.lead = true;
  save(); render();
}

function toggleDoneGrp(k){
  if(openDone[k]) delete openDone[k]; else openDone[k] = 1;
  render();
}

function toggleBonPick(wid){
  if(bonPick[wid]) delete bonPick[wid]; else bonPick[wid] = 1;
  render();
}

function payProfitBonus(){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const c = bonusCalc(j, j.workers||[]);
  if(!c.picked.length){ alert('Урамшуулал авах удирдагч алга.'); return; }
  if(c.pool <= 0 || c.totalDays <= 0){ alert('Хуваарилах дүн алга.'); return; }
  const dt = today();
  j.bonuses = j.bonuses || [];
  c.picked.forEach(w => {
    const d = wkDays(j, w.id);
    const amt = c.shares[w.id] || 0;
    if(amt <= 0) return;
    const eid = uid();
    j.bonuses.push({id: uid(), workerId: w.id, amount: amt, note: 'Ашгийн урамшуулал',
      kind: 'profit', date: dt, expenseId: eid});
    j.expenses.push({id: eid, desc: 'Ашгийн урамшуулал \u2014 '+w.name+' ('+nd(d)+' өдөр)',
      amount: amt, date: dt, cat: 'wage', asset: false});
  });
  bonPick = {}; save(); render();
}

function payBonus(wid){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const w = (j.workers||[]).find(x=>x.id===wid); if(!w) return;
  const a = num(document.getElementById('bonAmt').value);
  if(!(a>0)){ alert('Дүнг оруулна уу.'); return; }
  const note = document.getElementById('bonNote').value.trim();
  const dt = document.getElementById('bonDate').value || today();
  const eid = uid();
  j.bonuses = j.bonuses || [];
  j.bonuses.push({id: uid(), workerId: wid, amount: a, note, date: dt, expenseId: eid});
  j.expenses.push({id: eid, desc: 'Урамшуулал — '+w.name+(note?' ('+note+')':''), amount: a,
    date: dt, cat: 'wage', asset: false});
  save(); ui={}; render();
}

function delLabor(lid){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  j.labor = (j.labor||[]).filter(x=>x.id!==lid);
  save(); render();
}

function delEntry(eid){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  if(tab==='exp'){
    j.expenses = j.expenses.filter(e=>e.id!==eid);
    j.wagePays = (j.wagePays||[]).filter(p=>p.expenseId!==eid);
    j.bonuses = (j.bonuses||[]).filter(b=>b.expenseId!==eid);
  }
  else j.incomes = j.incomes.filter(e=>e.id!==eid);
  save(); render();
}

function saveDates(){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  j.startDate = (document.getElementById('edStart')||{}).value || '';
  j.endDate = (document.getElementById('edEnd')||{}).value || '';
  save(); ui={}; render();
}

function saveContract(){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const c = num(document.getElementById('cEdit').value);
  if(c>=0) j.contract = c;
  editContract=false; save(); render();
}

function delJob(){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  jobs = jobs.filter(x=>x.id!==openId); openId=null;
  if(view==='done' && jobs.filter(x=>x.done).length===0) view='list';
  save(); render();
}

function exportData(){
  const txt = JSON.stringify({jobs, roster});
  navigator.clipboard.writeText(txt).then(
    ()=>alert('Өгөгдөл хуулагдлаа. Тэмдэглэлдээ хадгалаарай.'),
    ()=>{ ui = {exp: txt}; render(); }
  );
}

function importData(){
  const el = document.getElementById('impBox');
  if(!el){ ui = {imp:1}; render(); return; }
  const txt = el.value.trim();
  if(!txt) return;
  try{
    const parsed = JSON.parse(txt);
    const d = Array.isArray(parsed) ? parsed : parsed.jobs;
    if(!Array.isArray(d)) throw 0;
    if(parsed && parsed.roster){ roster = parsed.roster; saveRoster(); }
    load2(d); save(); ui={}; render();
  }catch(e){ alert('Өгөгдөл буруу байна.'); }
}
function load2(d){
  jobs = d.map(j=>({owner: admin||me, members: [admin||me], createdAt: Date.now(), ...j, contract:j.contract ?? j.budget ?? 0, incomes:j.incomes||[], labor:j.labor||[], workers:j.workers||[], wagePays:j.wagePays||[], bonuses:j.bonuses||[], plan:j.plan||[],
    expenses:(j.expenses||[]).map(e=>({...e, asset: !!e.asset})),
    members: (j.members && j.members.length) ? j.members : ((admin && admin!==me) ? [admin, me] : [me]),
    owner: j.owner || admin || me}));
}

function boot(){
  const F = window.FB;
  F.onAuthStateChanged(F.auth, u => {
    me = u ? (u.email||'').toLowerCase() : null;
    jobs = []; roster = []; stock = []; shadow = {}; rshadow = {}; sshadow = {}; admin = null;
    overhead = []; oshadow = {}; cpYear = null; sups = []; supShadow = {};
    matUsers = []; matPct = null;
    booted = !me; ui = {}; openId = null; view = 'list';
    if(!me){ render(); return; }
    try{ localStorage.setItem('last-email', me); }catch(e){}
    render();
    const ref = F.doc(F.db, 'config', 'admin');
    F.getDoc(ref).then(d => {
      if(d.exists() && d.data().email){
        admin = (d.data().email||'').toLowerCase();
        matUsers = (d.data().mat||[]).map(x => String(x).toLowerCase());
        matPct = (typeof d.data().matPct === 'number') ? d.data().matPct : null;
        subscribe();
      } else {
        F.setDoc(ref, {email: me})
          .then(() => { admin = me; subscribe(); })
          .catch(() => { admin = me; subscribe(); });
      }
    }).catch(e => { syncErr = e.code || 'холболтын алдаа'; booted = true; render(); });
  });
}
try{ ui.lastEmail = localStorage.getItem('last-email')||''; }catch(e){}
render();
if(window.FB) boot(); else window.addEventListener('fb-ready', boot);
document.addEventListener('focusout', () => {
  if(pendingRender) setTimeout(() => { if(pendingRender){ pendingRender = false; render(); } }, 120);
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
