<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Ажлын зардал</title>
<style>
:root{
  --bg:#E9ECE8; --surface:#fff; --ink:#1B2A33; --muted:#6C7A80;
  --line:#D5DBD5; --good:#2F6B4F; --bad:#B33A2B; --blue:#2A5F7A;
  --asset:#8A6A1F; --track:#DCE2DC;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  padding-top:env(safe-area-inset-top);
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:560px;margin:0 auto;padding:20px 16px 70px}
button{font-family:inherit}
input{
  width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:16px;outline:none;font-family:inherit
}
input:focus{border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px}
.hero{background:var(--ink);color:#fff;border-radius:14px;padding:18px 16px;margin-bottom:20px}
.pairs{display:flex;gap:14px;margin-top:12px}
.pair{flex:1;padding:10px 12px;border-radius:9px;background:#F2F5F1}
.hero .pair{background:rgba(255,255,255,.08)}
.plabel{font-size:11.5px;color:var(--muted);margin-bottom:3px;line-height:1.3}
.hero .plabel{color:rgba(255,255,255,.6)}
.pval{font-size:17px;font-weight:700;letter-spacing:-.01em}
.pos{color:var(--good)} .neg{color:var(--bad)}
.hero .pos{color:#8FD3AE} .hero .neg{color:#F08A7A}
.meta{display:flex;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.hero .meta{border-top-color:rgba(255,255,255,.15)}
.mlabel{font-size:11.5px;color:var(--muted)} .hero .mlabel{color:rgba(255,255,255,.55)}
.mval{font-weight:600}
.jobcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;color:inherit;font-size:inherit}
.jobcard:active{background:#F7F9F6}
.jname{font-size:17px;font-weight:600}
.bar{height:5px;background:var(--track);border-radius:3px;margin:12px 0 8px;overflow:hidden}
.bar>i{display:block;height:100%}
.sub{font-size:12.5px;color:var(--muted);line-height:1.5}
.btn{padding:11px 16px;border-radius:8px;border:none;background:var(--ink);color:#fff;
  font-size:15px;font-weight:600;cursor:pointer;width:100%}
.btn.blue{background:var(--blue)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);width:auto}
.link{background:none;border:none;color:var(--muted);font-size:15px;padding:4px 0 14px;cursor:pointer}
.danger{background:none;border:none;color:var(--bad);font-size:14px;margin-top:20px;cursor:pointer}
.tabs{display:flex;background:#EDF0EC;border-radius:8px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;padding:8px 2px;border-radius:6px;border:none;background:transparent;color:var(--muted);
  font-size:13px;white-space:nowrap;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.row.exp{border-left:3px solid var(--bad)}
.row.inc{border-left:3px solid var(--blue)}
.row.asset{border-left:3px solid var(--asset)}
.rdesc{font-size:15px;font-weight:500}
.rdate{font-size:12px;color:var(--muted);margin-top:2px}
.ramt{font-weight:600;white-space:nowrap}
.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;background:#F4EEDC;
  color:var(--asset);font-size:11px;font-weight:600;vertical-align:1px}
.x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:4px 6px}
.empty{background:var(--surface);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted);margin-bottom:14px}
.note{color:var(--muted);font-size:14px;padding:6px 2px}
.tools{display:flex;gap:8px;margin-top:26px;justify-content:center}
.tools button{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
.h2{display:flex;gap:8px;align-items:center;margin-top:4px}
.check{display:flex;align-items:center;gap:9px;margin:2px 0 12px;cursor:pointer;
  font-size:14.5px;color:var(--ink);user-select:none}
.check input{width:20px;height:20px;accent-color:var(--asset);flex:none}
.total{display:flex;justify-content:space-between;align-items:center;background:#F4EEDC;
  border-radius:10px;padding:13px 15px;margin-bottom:12px}
.total b{font-size:18px;color:var(--asset)}
.small{background:none;border:1px solid var(--line);border-radius:7px;color:var(--muted);
  font-size:12.5px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.small.warn{color:var(--bad);border-color:#EBD2CE}
.jobtag{font-size:11.5px;color:var(--muted);margin-top:3px}
.off{opacity:.55}
.off .rdesc{text-decoration:line-through}
.secttl{font-size:13px;color:var(--muted);margin:22px 0 8px;font-weight:600}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px 6px 10px;margin-bottom:18px;overflow:hidden}
.chartscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chartscroll::-webkit-scrollbar{display:none}
.chartttl{font-size:13px;color:var(--muted);font-weight:600;padding:0 10px 2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:8px 10px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:16px;
  padding:6px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.inf{background:#F2F5F1;border-radius:10px;padding:12px;margin-bottom:10px}
.inf input,.inf textarea{margin-bottom:8px}
.inf .btns{display:flex;gap:8px}
.inf .btns .btn{padding:9px 14px;font-size:14px}
.confirm{background:#FBE9E6;border-radius:10px;padding:11px 12px;margin-top:8px;font-size:13.5px;color:var(--bad)}
.confirm .btns{display:flex;gap:8px;margin-top:9px}
.confirm button{border:none;border-radius:7px;padding:7px 14px;font-size:13.5px;cursor:pointer;font-family:inherit}
.confirm .yes{background:var(--bad);color:#fff}
.confirm .no{background:#fff;color:var(--muted);border:1px solid var(--line)}
textarea{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:15px;font-family:inherit;min-height:90px}
.wsel{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:16px;font-family:inherit}
.catsel{border:none;border-radius:5px;font-size:11.5px;padding:2px 4px;margin-top:4px;
  background:#EEF1ED;color:var(--ink);font-family:inherit;max-width:150px}
.catrow{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:5px 0}
.catrow i{width:10px;height:10px;border-radius:3px;flex:none}
.catrow .cn{flex:1;min-width:0}
.catrow .cp{color:var(--muted);font-size:12px;width:38px;text-align:right}
.catrow .ca{font-weight:600;white-space:nowrap}
.prog{margin:10px 0 4px}
.prog .pl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.prog .pb{height:7px;background:var(--track);border-radius:4px;overflow:hidden}
.prog .pb i{display:block;height:100%;border-radius:4px}
.warn{background:#FBE9E6;color:var(--bad);border-radius:8px;padding:9px 11px;font-size:13.5px;margin-top:12px;line-height:1.4}
.okmsg{background:#E6F0EA;color:var(--good);border-radius:8px;padding:9px 11px;font-size:13.5px;margin-top:12px;line-height:1.4}
.fc{font-size:13.5px;margin-top:10px;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--blue);padding:0;border:none;background:transparent}
.wtag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;background:#FBE9E6;
  color:var(--bad);font-size:11px;font-weight:600;vertical-align:2px}
.navbtn{display:flex;justify-content:space-between;align-items:center;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  margin-bottom:10px;cursor:pointer;font-size:15px;font-weight:600;color:inherit}
</style>

<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword,
         createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, where,
         arrayUnion, arrayRemove, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAePVA0CSv3lyKaHljscCedI1qA2rCMoIk",
  authDomain: "ajliin-zardal.firebaseapp.com",
  projectId: "ajliin-zardal",
  storageBucket: "ajliin-zardal.firebasestorage.app",
  messagingSenderId: "37354445814",
  appId: "1:37354445814:web:9b75ad784d1bff463e45d7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try {
  db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });
} catch (e) {
  db = initializeFirestore(app, {});
}

window.FB = { auth, db, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut, collection, doc, setDoc, updateDoc,
  deleteDoc, onSnapshot, query, where, arrayUnion, arrayRemove, deleteField };
window.dispatchEvent(new Event('fb-ready'));
</script>

<script>
const KEY = 'ajliin-zardal-v1';
const RKEY = 'ajliin-ajilchid-v1';
let jobs = [];
let roster = [];
let pickOpen = false;
let ui = {};
let openId = null, tab = 'exp', newJob = false, editContract = false, view = 'list';

const fmt = n => new Intl.NumberFormat('mn-MN',{maximumFractionDigits:0}).format(Math.round(n||0)) + '\u20AE';
const today = () => new Date().toISOString().slice(0,10);
const uid = () => Math.random().toString(36).slice(2,10);
const num = v => parseFloat(String(v).replace(/[^0-9.\-]/g,''));
const group = v => {
  const d = String(v).replace(/[^0-9]/g,'');
  return d ? d.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : '';
};
function liveNum(el){
  const end = el.selectionStart === el.value.length;
  el.value = group(el.value);
  if(end) el.setSelectionRange(el.value.length, el.value.length);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const norm = j => ({
  ...j,
  contract: j.contract ?? j.budget ?? 0,
  incomes: j.incomes||[],
  labor: j.labor||[],
  workers: j.workers||[],
  wagePays: j.wagePays||[],
  bonuses: j.bonuses||[],
  members: j.members||[],
  expenses: (j.expenses||[]).map(e=>({...e, asset: !!e.asset}))
});

const LISTS = ['expenses','incomes','labor','workers','wagePays','bonuses'];
const FIELDS = ['name','contract','type','progress','done','doneDate','members','owner','createdAt'];

let me = null, booted = false, syncErr = '', pendingRender = false;
let shadow = {}, rshadow = {};

function legacyJobs(){
  try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; }
}

function cloudRender(){
  const ae = document.activeElement;
  if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){ pendingRender = true; return; }
  render();
}

function jobDiff(prev, j){
  const u = {}, extra = [];
  FIELDS.forEach(k => {
    if(JSON.stringify(prev[k]) !== JSON.stringify(j[k])) u[k] = j[k] === undefined ? FB.deleteField() : j[k];
  });
  LISTS.forEach(k => {
    const a = prev[k]||[], b = j[k]||[];
    if(JSON.stringify(a) === JSON.stringify(b)) return;
    const ai = new Map(a.map(x=>[x.id,JSON.stringify(x)])), bi = new Map(b.map(x=>[x.id,1]));
    const added = b.filter(x => !ai.has(x.id));
    const removed = a.filter(x => !bi.has(x.id));
    const edited = b.some(x => ai.has(x.id) && ai.get(x.id) !== JSON.stringify(x));
    if(edited || (added.length && removed.length)) u[k] = b;
    else if(added.length) u[k] = FB.arrayUnion.apply(null, added);
    else if(removed.length) u[k] = FB.arrayRemove.apply(null, removed);
  });
  return u;
}

function save(){
  if(!me || !window.FB) return;
  jobs.forEach(j => {
    const cur = JSON.stringify(j);
    if(shadow[j.id] === cur) return;
    const prev = shadow[j.id] ? JSON.parse(shadow[j.id]) : null;
    shadow[j.id] = cur;
    const ref = FB.doc(FB.db, 'jobs', j.id);
    const p = prev ? FB.updateDoc(ref, jobDiff(prev, j)) : FB.setDoc(ref, j);
    p.catch(e => { syncErr = e.code || 'алдаа'; render(); });
  });
  Object.keys(shadow).forEach(id => {
    if(!jobs.some(j => j.id === id)){
      delete shadow[id];
      FB.deleteDoc(FB.doc(FB.db, 'jobs', id)).catch(e => { syncErr = e.code||'алдаа'; });
    }
  });
}

function saveRoster(){
  if(!me || !window.FB) return;
  roster.forEach(r => {
    const cur = JSON.stringify(r);
    if(rshadow[r.id] === cur) return;
    rshadow[r.id] = cur;
    FB.setDoc(FB.doc(FB.db, 'roster', r.id), {...r, owner: r.owner || me})
      .catch(e => { syncErr = e.code||'алдаа'; });
  });
  Object.keys(rshadow).forEach(id => {
    if(!roster.some(r => r.id === id)){
      delete rshadow[id];
      FB.deleteDoc(FB.doc(FB.db, 'roster', id)).catch(()=>{});
    }
  });
}

function subscribe(){
  const F = window.FB;
  F.onSnapshot(
    F.query(F.collection(F.db, 'jobs'), F.where('members', 'array-contains', me)),
    snap => {
      jobs = snap.docs.map(d => norm({...d.data(), id: d.id}))
        .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
      shadow = {}; jobs.forEach(j => shadow[j.id] = JSON.stringify(j));
      booted = true; syncErr = ''; cloudRender();
    },
    e => { syncErr = e.code || 'холболтын алдаа'; booted = true; render(); }
  );
  F.onSnapshot(
    F.query(F.collection(F.db, 'roster'), F.where('owner', '==', me)),
    snap => {
      roster = snap.docs.map(d => ({...d.data(), id: d.id}));
      rshadow = {}; roster.forEach(r => rshadow[r.id] = JSON.stringify(r));
      cloudRender();
    },
    ()=>{}
  );
}

function doLogin(signup){
  const F = window.FB;
  const em = document.getElementById('authEmail').value.trim().toLowerCase();
  const pw = document.getElementById('authPass').value;
  if(!em || pw.length < 6){ ui.authErr = 'Имэйл болон 6-аас дээш тэмдэгт бүхий нууц үг оруулна уу.'; render(); return; }
  ui.authErr = ''; ui.authBusy = 1; render();
  const fn = signup ? F.createUserWithEmailAndPassword : F.signInWithEmailAndPassword;
  fn(F.auth, em, pw).catch(e => {
    const m = {
      'auth/invalid-credential':'Имэйл эсвэл нууц үг буруу байна.',
      'auth/wrong-password':'Нууц үг буруу байна.',
      'auth/user-not-found':'Ийм хэрэглэгч алга. "Бүртгүүлэх" дарна уу.',
      'auth/email-already-in-use':'Энэ имэйл бүртгэлтэй байна. "Нэвтрэх" дарна уу.',
      'auth/weak-password':'Нууц үг хэт богино байна.',
      'auth/invalid-email':'Имэйл буруу байна.',
      'auth/network-request-failed':'Интернэт холболтоо шалгана уу.'
    };
    ui.authErr = m[e.code] || e.code;
    ui.authBusy = 0; render();
  });
}

function logout(){
  if(window.FB) window.FB.signOut(window.FB.auth);
}

function authView(){
  return '<div style="padding:40px 0 0"><div style="text-align:center;margin-bottom:26px">'
    + '<div style="font-size:22px;font-weight:700">Ажлын зардал</div>'
    + '<div style="color:var(--muted);font-size:14px;margin-top:5px">Имэйлээрээ нэвтэрч ажлаа үргэлжлүүлнэ</div></div>'
    + '<div class="card">'
    + '<input id="authEmail" type="email" inputmode="email" placeholder="Имэйл" style="margin-bottom:9px" value="'+esc(ui.lastEmail||'')+'">'
    + '<input id="authPass" type="password" placeholder="Нууц үг" style="margin-bottom:12px">'
    + (ui.authErr ? '<div class="warn" style="margin:0 0 12px">'+esc(ui.authErr)+'</div>' : '')
    + '<button class="btn" style="margin-bottom:8px" onclick="doLogin(false)">'
    + (ui.authBusy ? 'Түр хүлээнэ үү…' : 'Нэвтрэх')+'</button>'
    + '<button class="btn ghost" style="width:100%" onclick="doLogin(true)">Шинээр бүртгүүлэх</button>'
    + '</div>'
    + '<div class="note" style="margin-top:14px;text-align:center">Анх удаа бол "Шинээр бүртгүүлэх" дарна уу.</div></div>';
}

function migrateLocal(){
  const old = legacyJobs();
  if(!old.length) return;
  old.forEach((j, i) => {
    const nj = norm({...j, owner: me, members: [me], createdAt: Date.now() - (old.length - i) * 1000});
    FB.setDoc(FB.doc(FB.db, 'jobs', nj.id || uid()), nj).catch(e => { syncErr = e.code||'алдаа'; });
  });
  try{ localStorage.setItem(KEY + '-migrated', '1'); }catch(e){}
  ui = {}; render();
}

const sum = a => a.reduce((s,e)=>s+e.amount,0);
const spent = j => sum(j.expenses);
const earned = j => sum(j.incomes);
const assets = j => j.expenses.filter(e=>e.asset && !e.writtenOff);
const written = j => j.expenses.filter(e=>e.asset && e.writtenOff);
const assetVal = j => sum(assets(j));
const CATS = [
  {k:'mat',   t:'Материал',        c:'#2A5F7A'},
  {k:'wage',  t:'Цалин',           c:'#2F6B4F'},
  {k:'trans', t:'Тээвэр/шатахуун', c:'#8A6A1F'},
  {k:'rent',  t:'Техник түрээс',   c:'#6B4C8A'},
  {k:'food',  t:'Хоол',            c:'#C0762F'},
  {k:'tax',   t:'Татвар',          c:'#A33D5C'},
  {k:'other', t:'Бусад',           c:'#8A9499'}
];
const TYPES = [
  {k:'asm', t:'Угсралт',     c:'#2A5F7A'},
  {k:'dsg', t:'Зураг төсөл', c:'#6B4C8A'}
];
const typeOf = k => TYPES.find(t=>t.k===k);
let newType = 'asm';
const catOf = k => CATS.find(c=>c.k===k) || CATS[CATS.length-1];
let selCat = 'mat';
const spentPct = j => j.contract>0 ? spent(j)/j.contract*100 : 0;
const lagOf = j => (j.progress||0) > 0 || spent(j) > 0 ? spentPct(j) - (j.progress||0) : 0;
const workDays = j => new Set((j.labor||[]).map(e=>e.date)).size;
const wkDays = (j,wid) => (j.labor||[]).filter(e=>e.workerId===wid).reduce((s,e)=>s+e.people,0);
const wkPaidDays = (j,wid) => (j.wagePays||[]).filter(p=>p.workerId===wid).reduce((s,p)=>s+p.days,0);
const wkDue = (j,w) => (wkDays(j,w.id) - wkPaidDays(j,w.id)) * w.rate;
const wageAccrued = j => (j.workers||[]).reduce((s,w)=>s+wkDays(j,w.id)*w.rate,0);
const wagePaid = j => (j.wagePays||[]).reduce((s,p)=>s+p.amount,0);
const wkBonus = (j,wid) => (j.bonuses||[]).filter(b=>b.workerId===wid).reduce((s,b)=>s+b.amount,0);
const bonusTotal = j => (j.bonuses||[]).reduce((s,b)=>s+b.amount,0);
const manDays = j => (j.labor||[]).reduce((s,e)=>s+e.people,0);
const nd = v => (Math.round(v*10)/10).toString();

function pair(label, value){
  return '<div class="pair"><div class="plabel">'+label+'</div><div class="pval '+(value<0?'neg':'pos')+'">'+fmt(value)+'</div></div>';
}

function render(){
  if(!window.FB){ document.getElementById('app').innerHTML =
    '<div class="note" style="padding:40px 0;text-align:center">Ачаалж байна…</div>'; return; }
  if(!me){ document.getElementById('app').innerHTML = authView(); return; }
  if(!booted){ document.getElementById('app').innerHTML =
    '<div class="note" style="padding:40px 0;text-align:center">Өгөгдөл ачаалж байна…</div>'; return; }
  const job = jobs.find(j=>j.id===openId);
  let html;
  if(job) html = detailView(job);
  else if(view === 'assets') html = assetsView();
  else if(view === 'done') html = doneView();
  else if(view === 'types') html = typesView();
  else if(view === 'roster') html = rosterView();
  else html = listView();
  document.getElementById('app').innerHTML = html;
  document.querySelectorAll('.chartscroll').forEach(el => { el.scrollLeft = el.scrollWidth; });
}

function listView(){
  const active = jobs.filter(j=>!j.done);
  const done = jobs.filter(j=>j.done);
  const tC = jobs.reduce((s,j)=>s+j.contract,0);
  const tS = jobs.reduce((s,j)=>s+spent(j),0);
  const tE = jobs.reduce((s,j)=>s+earned(j),0);
  const tA = jobs.reduce((s,j)=>s+assetVal(j),0);
  const tW = jobs.reduce((s,j)=>s+workDays(j),0);

  let h = '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">'
    + '<span style="font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
    + esc(me)+'</span><button class="small" onclick="logout()">Гарах</button></div>';

  if(syncErr){
    h += '<div class="warn" style="margin:0 0 12px">Сервертэй холбогдоход алдаа гарлаа ('+esc(syncErr)
      + '). Оруулсан бичилт интернэт сэргэмэгц илгээгдэнэ.</div>';
  }

  let lg = [];
  try{ lg = localStorage.getItem(KEY+'-migrated') ? [] : legacyJobs(); }catch(e){}
  if(lg.length){
    h += '<div class="card" style="margin-bottom:14px"><div style="font-weight:600;margin-bottom:6px">'
      + 'Хуучин өгөгдөл олдлоо</div>'
      + '<div class="sub" style="margin-bottom:10px">Энэ утсанд сервергүй үед бүртгэсэн '+lg.length
      + ' ажил байна. Сервер рүү шилжүүлбэл бусад төхөөрөмж дээр ч харагдана.</div>'
      + '<button class="btn" onclick="migrateLocal()">Сервер рүү шилжүүлэх</button></div>';
  }

  h += '<div class="hero"><div style="font-size:13px;opacity:.6">Бүх ажлын нэгдсэн дүн</div>'
    + '<div class="pairs">' + pair('Гэрээнээс гарах ашиг', tC-tS) + pair('Орлогоос гарсан баланс', tE-tS) + '</div>'
    + '<div class="meta">'
    + '<div><div class="mlabel">Гэрээний дүн</div><div class="mval">'+fmt(tC)+'</div></div>'
    + '<div><div class="mlabel">Орлого</div><div class="mval">'+fmt(tE)+'</div></div>'
    + '<div><div class="mlabel">Зардал</div><div class="mval">'+fmt(tS)+'</div></div>'
    + '<div><div class="mlabel">Үндсэн хөрөнгө</div><div class="mval">'+fmt(tA)+'</div></div>'
    + (tW>0 ? '<div><div class="mlabel">Ажилласан өдөр</div><div class="mval">'+tW+'</div></div>' : '')
    + '</div></div>';

  const allInc = [], allExp = [];
  jobs.forEach(j=>{ allInc.push(...j.incomes); allExp.push(...j.expenses); });
  h += chartSvg({incomes: allInc, expenses: allExp});

  h += '<button class="navbtn" onclick="view=\'assets\';render()">'
     + '<span>Үндсэн хөрөнгө</span><span style="color:var(--asset)">'+fmt(tA)+' ›</span></button>';

  h += '<button class="navbtn" onclick="view=\'roster\';render()">'
     + '<span>Ажилчид</span><span style="color:var(--muted)">'+roster.length+' хүн ›</span></button>';

  h += '<button class="navbtn" onclick="view=\'types\';render()">'
     + '<span>Ажлын төрлөөр</span><span style="color:var(--muted)">Угсралт / Зураг төсөл ›</span></button>';

  if(done.length>0){
    const dp = done.reduce((s,j)=>s+(earned(j)-spent(j)),0);
    h += '<button class="navbtn" onclick="view=\'done\';render()">'
       + '<span>Дууссан ажил ('+done.length+')</span>'
       + '<span class="'+(dp<0?'neg':'pos')+'">'+fmt(dp)+' ›</span></button>';
  }

  if(newJob){
    h += '<div class="card">'
      + '<input id="nName" placeholder="Ажлын нэр" style="margin-bottom:10px">'
      + '<input id="nContract" placeholder="Гэрээний дүн (₮)" inputmode="numeric" oninput="liveNum(this)" style="margin-bottom:12px">'
      + '<div class="chips">' + TYPES.map(t =>
          '<button class="chip'+(t.k===newType?' on':'')+'" onclick="pickType(this,\''+t.k+'\')">'+t.t+'</button>'
        ).join('') + '</div>'
      + '<div style="display:flex;gap:8px"><button class="btn" onclick="addJob()">Ажил үүсгэх</button>'
      + '<button class="btn ghost" onclick="newJob=false;render()">Болих</button></div></div>';
  } else {
    h += '<button class="btn" onclick="newJob=true;render()">+ Шинэ ажил</button>';
  }

  if(active.length>0) h += '<div class="secttl" style="margin:24px 0 10px">Явагдаж буй ажил</div>';
  if(active.length===0 && !newJob) h += '<div class="empty" style="margin-top:14px">Явагдаж буй ажил алга. Шинэ ажил үүсгэнэ үү.</div>';

  active.forEach(j=>{
    const s = spent(j), cb = j.contract - s, ib = earned(j) - s, av = assetVal(j);
    const pct = j.contract>0 ? Math.min(s/j.contract*100,100) : 0;
    h += '<button class="jobcard" onclick="openJob(\''+j.id+'\')">'
      + '<div class="jname">'+esc(j.name)+typeTag(j)+(lagOf(j)>=10?'<span class="wtag">анхаар</span>':'')+'</div>'
      + '<div class="pairs">'+pair('Гэрээний баланс',cb)+pair('Орлогын баланс',ib)+'</div>'
      + progBars(j)
      + '<div class="sub">Гэрээ '+fmt(j.contract)+' · Орлого '+fmt(earned(j))+' · Зардал '+fmt(s)
      + (av>0 ? '<br>Үүнээс үндсэн хөрөнгө '+fmt(av) : '')
      + (manDays(j)>0 ? '<br>Ажилласан өдөр: '+workDays(j)+' · Хүн өдөр: '+nd(manDays(j)) : '') + '</div>'
      + '</button>';
  });

  h += '<div class="tools"><button onclick="exportData()">Өгөгдөл хуулах</button>'
     + '<button onclick="ui={imp:1};render()">Сэргээх</button></div>';
  if(ui.exp){
    h += '<div class="inf" style="margin-top:10px">'
      + '<div class="rdate" style="margin-bottom:6px">Доорх текстийг сонгож хуулж аваарай:</div>'
      + '<textarea readonly>'+esc(ui.exp)+'</textarea>'
      + '<div class="btns"><button class="btn ghost" onclick="ui={};render()">Хаах</button></div></div>';
  }
  if(ui.imp){
    h += '<div class="inf" style="margin-top:10px">'
      + '<textarea id="impBox" placeholder="Өмнө хуулсан өгөгдлөө энд буулгана уу"></textarea>'
      + '<div class="btns"><button class="btn" onclick="importData()">Сэргээх</button>'
      + '<button class="btn ghost" onclick="ui={};render()">Болих</button></div></div>';
  }
  return h;
}

function progBars(j){
  const pr = j.progress||0, sp = spentPct(j);
  return '<div class="prog"><div class="pl"><span>Гүйцэтгэл</span><span>'+Math.round(pr)+'%</span></div>'
    + '<div class="pb"><i style="width:'+Math.min(pr,100)+'%;background:var(--blue)"></i></div></div>'
    + '<div class="prog" style="margin-bottom:10px"><div class="pl"><span>Төсвийн зарцуулалт</span><span>'+Math.round(sp)+'%</span></div>'
    + '<div class="pb"><i style="width:'+Math.min(sp,100)+'%;background:'+(sp-pr>=10||sp>100?'var(--bad)':'var(--good)')+'"></i></div></div>';
}

function progressCard(j){
  const pr = j.progress||0, s = spent(j), lag = lagOf(j);
  let h = '<div class="card" style="margin-bottom:18px">'
    + '<div style="display:flex;justify-content:space-between;align-items:baseline">'
    + '<span style="font-weight:600">Ажлын гүйцэтгэл</span>'
    + '<b id="prVal" style="font-size:20px;color:var(--blue)">'+pr+'%</b></div>'
    + '<input type="range" min="0" max="100" step="5" value="'+pr+'" '
    + 'oninput="document.getElementById(\'prVal\').textContent=this.value+\'%\'" '
    + 'onchange="setProgress(this.value)">'
    + progBars(j);
  if(pr > 0 && s > 0){
    const fcost = s / pr * 100, fprofit = j.contract - fcost;
    h += '<div class="fc">Энэ хурдаар үргэлжилбэл эцсийн зардал ≈ <b>'+fmt(fcost)+'</b>, '
      + 'ашиг ≈ <b class="'+(fprofit<0?'neg':'pos')+'">'+fmt(fprofit)+'</b></div>';
  }
  if(lag >= 10){
    h += '<div class="warn">⚠ Зарцуулалт гүйцэтгэлээс '+Math.round(lag)+'% түрүүлж байна. Зардлаа хянах хэрэгтэй.</div>';
  } else if(pr > 0 && s > 0){
    h += '<div class="okmsg">Зарцуулалт гүйцэтгэлдээ тохирч байна.</div>';
  } else if(pr === 0){
    h += '<div class="fc" style="color:var(--muted)">Гүйцэтгэлийн хувийг гулсуулж оруулбал төсвийн зарцуулалттай харьцуулж, эцсийн ашгийг таамаглана.</div>';
  }
  return h + '</div>';
}

function catCard(j){
  if(j.expenses.length === 0) return '';
  const tot = spent(j);
  const rows = CATS.map(c => ({c, v: j.expenses.filter(e=>catOf(e.cat).k===c.k).reduce((s,e)=>s+e.amount,0)}))
    .filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  // donut
  const R = 46, C = 2*Math.PI*R;
  let off = 0, arcs = '';
  rows.forEach(r => {
    const len = r.v / tot * C;
    arcs += '<circle r="'+R+'" cx="60" cy="60" fill="none" stroke="'+r.c.c+'" stroke-width="18" '
      + 'stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 60 60)"></circle>';
    off += len;
  });
  let h = '<div class="card" style="margin-bottom:18px"><div style="font-weight:600;margin-bottom:10px">Зардлын бүтэц</div>'
    + '<div style="display:flex;gap:14px;align-items:center">'
    + '<svg width="120" height="120" viewBox="0 0 120 120" style="flex:none">'+arcs+'</svg><div style="flex:1;min-width:0">';
  rows.forEach(r => {
    h += '<div class="catrow"><i style="background:'+r.c.c+'"></i><span class="cn">'+r.c.t+'</span>'
      + '<span class="cp">'+Math.round(r.v/tot*100)+'%</span></div>';
  });
  h += '</div></div><div style="margin-top:10px;border-top:1px solid var(--line);padding-top:6px">';
  rows.forEach(r => {
    h += '<div class="catrow"><i style="background:'+r.c.c+'"></i><span class="cn">'+r.c.t+'</span>'
      + '<span class="ca">'+fmt(r.v)+'</span></div>';
  });
  return h + '</div></div>';
}

function chartSvg(j){
  const map = {};
  j.incomes.forEach(e => { (map[e.date] = map[e.date] || {i:0,x:0}).i += e.amount; });
  j.expenses.forEach(e => { (map[e.date] = map[e.date] || {i:0,x:0}).x += e.amount; });
  const days = Object.keys(map).sort();
  if(days.length === 0) return '';

  let run = 0;
  const pts = days.map(d => { run += map[d].i - map[d].x; return {d, v: run, day: map[d]}; });

  const H = 132, TOP = 22, BOT = 34, STEP = 52;
  const width = Math.max(pts.length * STEP + 30, 300);
  const hi = Math.max(0, ...pts.map(p=>p.v));
  const lo = Math.min(0, ...pts.map(p=>p.v));
  const span = (hi - lo) || 1;
  const y = v => TOP + H - (v - lo) / span * H;
  const x = k => 22 + k * STEP;
  const zero = y(0);

  let poly = pts.map((p,k)=> x(k)+','+y(p.v)).join(' ');
  const areaUp = 'M'+x(0)+','+zero+' L'+poly.split(' ').join(' L')+' L'+x(pts.length-1)+','+zero+' Z';

  let dots = '', labels = '';
  pts.forEach((p,k)=>{
    const py = y(p.v);
    dots += '<circle cx="'+x(k)+'" cy="'+py+'" r="3.5" fill="'+(p.v<0?'#B33A2B':'#2F6B4F')+'"></circle>';
    labels += '<text x="'+x(k)+'" y="'+(TOP+H+16)+'" font-size="10" fill="#6C7A80" text-anchor="middle">'
      + p.d.slice(5).replace('-','/') + '</text>';
    const flow = p.day.i - p.day.x;
    labels += '<text x="'+x(k)+'" y="'+(TOP+H+29)+'" font-size="9.5" text-anchor="middle" fill="'
      + (flow<0?'#B33A2B':'#2A5F7A')+'">'+(flow>0?'+':'')+group(Math.round(flow/1000))+'к</text>';
  });

  const last = pts[pts.length-1].v;
  return '<div class="chartbox"><div class="chartttl">Мөнгөн урсгал (хуримтлагдсан)'
    + '<span style="float:right;color:'+(last<0?'#B33A2B':'#2F6B4F')+'">'+fmt(last)+'</span></div>'
    + '<div class="chartscroll"><svg width="'+width+'" height="'+(TOP+H+BOT)+'" viewBox="0 0 '+width+' '+(TOP+H+BOT)+'">'
    + '<defs>'
    + '<clipPath id="up"><rect x="0" y="0" width="'+width+'" height="'+zero+'"></rect></clipPath>'
    + '<clipPath id="dn"><rect x="0" y="'+zero+'" width="'+width+'" height="'+(TOP+H-zero+2)+'"></rect></clipPath>'
    + '</defs>'
    + '<path d="'+areaUp+'" fill="#2F6B4F" opacity=".14" clip-path="url(#up)"></path>'
    + '<path d="'+areaUp+'" fill="#B33A2B" opacity=".14" clip-path="url(#dn)"></path>'
    + '<line x1="6" y1="'+zero+'" x2="'+(width-6)+'" y2="'+zero+'" stroke="#B9C2BA" stroke-dasharray="3 3"></line>'
    + '<text x="8" y="'+(zero-5)+'" font-size="9.5" fill="#9AA5A9">0</text>'
    + '<polyline points="'+poly+'" fill="none" stroke="#1B2A33" stroke-width="2" '
    + 'stroke-linejoin="round" stroke-linecap="round"></polyline>'
    + dots + labels + '</svg></div>'
    + (pts.length > 6 ? '<div class="legend" style="padding-top:4px">← Өмнөх өдрүүдийг харахын тулд баруунаас зүүн тийш гүйлгэнэ</div>' : '')
    + '<div class="legend"><span>Шугам: тухайн өдрийн эцсийн үлдэгдэл</span>'
    + '<span>Доор: тухайн өдрийн цэвэр урсгал (мянгаар)</span></div></div>';
}

function detailView(j){
  const s = spent(j), e = earned(j), av = assetVal(j);
  let h = '<button class="link" onclick="openId=null;editContract=false;render()">← '
    + (view==='done' ? 'Дууссан ажил' : 'Бүх ажил') + '</button>'
    + '<div class="card" style="border-radius:14px;padding:18px;margin-bottom:18px">'
    + '<div style="font-size:20px;font-weight:600">'+esc(j.name)
    + (j.done ? '<span class="tag" style="background:#E4EAE6;color:var(--good)">дууссан</span>' : '')+'</div>'
    + '<div class="chips" style="margin:10px 0 0">' + TYPES.map(t =>
        '<button class="chip'+(j.type===t.k?' on':'')+'" onclick="setType(\''+t.k+'\')">'+t.t+'</button>'
      ).join('') + '</div>'
    + '<div class="pairs">'+pair('Гэрээний дүнгээс гарсан баланс', j.contract-s)+pair('Орлогоос гарсан баланс', e-s)+'</div>'
    + '<div class="meta"><div><div class="mlabel">Гэрээний дүн</div>';
  if(editContract){
    h += '<div class="h2"><input id="cEdit" inputmode="numeric" oninput="liveNum(this)" value="'+group(j.contract)+'" style="width:130px;padding:7px 9px;font-size:15px">'
       + '<button class="btn" style="width:auto;padding:7px 12px;font-size:14px" onclick="saveContract()">OK</button></div>';
  } else {
    h += '<div class="mval" style="cursor:pointer" onclick="editContract=true;render()">'+fmt(j.contract)
       + ' <span style="color:var(--muted);font-size:12px;font-weight:400">засах</span></div>';
  }
  h += '</div><div><div class="mlabel">Орсон орлого</div><div class="mval">'+fmt(e)+'</div></div>'
    + '<div><div class="mlabel">Нийт зардал</div><div class="mval">'+fmt(s)+'</div></div>'
    + '<div><div class="mlabel">Үндсэн хөрөнгө</div><div class="mval">'+fmt(av)+'</div></div>'
    + '<div><div class="mlabel">Ажилласан өдөр</div><div class="mval">'+workDays(j)+'</div></div>'
    + '<div><div class="mlabel">Хүн өдөр</div><div class="mval">'+nd(manDays(j))+'</div></div></div>'
    + '<label class="check" style="margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)">'
    + '<input type="checkbox" onchange="toggleDone()"'+(j.done?' checked':'')+'>'
    + 'Ажил дууссан</label>'
    + memberBox(j) + '</div>';

  h += progressCard(j);
  h += chartSvg(j);
  h += catCard(j);

  h += '<div class="card" style="margin-bottom:18px">'
    + '<div class="tabs">'
    + '<button class="'+(tab==='exp'?'on':'')+'" onclick="tab=\'exp\';render()">Зардал</button>'
    + '<button class="'+(tab==='inc'?'on':'')+'" onclick="tab=\'inc\';render()">Орлого</button>'
    + '<button class="'+(tab==='labor'?'on':'')+'" onclick="tab=\'labor\';render()">Хүн өдөр</button>'
    + '<button class="'+(tab==='asset'?'on':'')+'" onclick="tab=\'asset\';render()">Хөрөнгө</button>'
    + '</div>';

  if(tab === 'labor'){
    const L = (j.labor||[]).slice().sort((a,b)=> a.date<b.date?1:-1);
    const dayCount = new Set(L.map(x=>x.date)).size;
    const W = j.workers||[];
    const acc = wageAccrued(j), paid = wagePaid(j);

    // ирц бүртгэх
    if(W.length === 0){
      h += '<div class="note" style="padding:0 2px 10px">Эхлээд ажилтнаа нэмнэ үү. Дараа нь ирцийг нь өдрөөр бүртгэнэ.</div></div>';
    } else {
      h += '<select id="lWorker" class="wsel">'
        + W.map(w=>'<option value="'+w.id+'">'+esc(w.name)+' · '+fmt(w.rate)+'/өдөр</option>').join('')
        + '</select>'
        + '<div style="display:flex;gap:8px;margin:8px 0 10px">'
        + '<input id="lDays" placeholder="Өдөр" inputmode="decimal" value="1">'
        + '<input id="eDate" type="date" value="'+today()+'"></div>'
        + '<button class="btn" onclick="addAttend()">Ирц бүртгэх</button></div>';
    }

    // нэгдсэн тоо
    h += '<div class="pairs" style="margin:0 0 10px">'
      + '<div class="pair"><div class="plabel">Нийт ажилласан өдөр</div>'
      + '<div class="pval" style="color:var(--blue)">'+dayCount+'</div></div>'
      + '<div class="pair"><div class="plabel">Нийт хүн өдөр</div>'
      + '<div class="pval" style="color:var(--blue)">'+nd(manDays(j))+'</div></div></div>'
      + '<div class="pairs" style="margin:0 0 14px">'
      + '<div class="pair"><div class="plabel">Ногдсон цалин</div>'
      + '<div class="pval" style="color:var(--ink)">'+fmt(acc)+'</div></div>'
      + '<div class="pair"><div class="plabel">Олгоогүй үлдэгдэл</div>'
      + '<div class="pval '+(acc-paid>0?'neg':'pos')+'">'+fmt(acc-paid)+'</div></div></div>'
      + '<div class="fc" style="color:var(--muted);margin:0 2px 14px">Олгосон цалин '+fmt(paid)
      + (bonusTotal(j)>0 ? ' · Урамшуулал '+fmt(bonusTotal(j)) : '')
      + ' — зардалд автоматаар бүртгэгдсэн.</div>';

    // албан тушаалаар
    const byRole = {};
    W.forEach(w => {
      const r = w.role || 'Тодорхойгүй';
      const d = wkDays(j, w.id);
      if(!byRole[r]) byRole[r] = {days:0, n:0, wage:0};
      byRole[r].days += d; byRole[r].n++; byRole[r].wage += d * w.rate;
    });
    const roleRows = Object.keys(byRole).map(k=>({k, d:byRole[k].days, n:byRole[k].n, wg:byRole[k].wage}))
      .sort((a,b)=>b.d-a.d);
    if(roleRows.some(r=>r.d>0)){
      const mx = Math.max.apply(null, roleRows.map(r=>r.d));
      h += '<div class="card" style="margin-bottom:16px"><div style="font-weight:600;margin-bottom:10px">Албан тушаалаар</div>';
      roleRows.forEach(r => {

function typeTag(j){
  const t = typeOf(j.type);
  if(!t) return '';
  return '<span class="tag" style="background:'+t.c+'22;color:'+t.c+'">'+t.t+'</span>';
}

function rosterStats(r){
  let days = 0, paid = 0, njobs = 0, due = 0, bonus = 0, open = [];
  jobs.forEach(j => {
    const w = (j.workers||[]).find(x => x.rid === r.id || x.name === r.name);
    if(!w) return;
    njobs++;
    days += wkDays(j, w.id);
    paid += (j.wagePays||[]).filter(p=>p.workerId===w.id).reduce((s,p)=>s+p.amount,0);
    bonus += wkBonus(j, w.id);
    const d = wkDue(j, w);
    due += d;
    if(d > 0) open.push({name: j.name, amt: d, days: wkDays(j,w.id) - wkPaidDays(j,w.id)});
  });
  return {days, paid, njobs, due, bonus, open};
}

function addRoster(){
  const name = document.getElementById('raName').value.trim();
  const r = num(document.getElementById('raRate').value) || 0;
  if(!name){ alert('Нэрээ оруулна уу.'); return; }
  roster.push({id: uid(), name, rate: r, role: document.getElementById('raRole').value.trim(), owner: me});
  saveRoster(); ui={}; render();
}

function saveRosterEdit(rid){
  const r = roster.find(x=>x.id===rid); if(!r) return;
  const name = document.getElementById('reName').value.trim();
  const v = num(document.getElementById('reRate').value);
  if(name) r.name = name;
  if(v>=0) r.rate = v;
  r.role = document.getElementById('reRole').value.trim();
  saveRoster(); ui={}; render();
}

function delRoster(rid){
  roster = roster.filter(x=>x.id!==rid);
  saveRoster(); ui={}; render();
}

function rosterAdd(name, rate, role){
  const hit = roster.find(r => r.name.toLowerCase() === name.toLowerCase());
  if(hit) return hit.id;
  const r = {id: uid(), name, rate, role, owner: me};
  roster.push(r); saveRoster();
  return r.id;
}

function importWorker(rid){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const r = roster.find(x=>x.id===rid); if(!r) return;
  j.workers = j.workers || [];
  if(j.workers.some(w => w.rid === r.id || w.name === r.name)) return;
  j.workers.push({id: uid(), rid: r.id, name: r.name, rate: r.rate, role: r.role});
  save(); render();
}

  el.parentNode.querySelectorAll('.chip').forEach(b => b.classList.remove('on'));

function setType(k){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  j.type = (j.type === k) ? undefined : k;
  save(); render();
}

function doneView(){
  const done = jobs.filter(j=>j.done);
  const tp = done.reduce((s,j)=>s+(earned(j)-spent(j)),0);
  let h = '<button class="link" onclick="view=\'list\';render()">← Буцах</button>'
    + '<div class="total"><span>Дууссан ажлуудын ашиг</span><b class="'+(tp<0?'neg':'pos')+'">'+fmt(tp)+'</b></div>';
  if(done.length===0) return h + '<div class="note">Дууссан ажил алга.</div>';
  done.forEach(j=>{
    const s = spent(j), ib = earned(j) - s;
    h += '<button class="jobcard" onclick="openJob(\''+j.id+'\')">'
      + '<div class="jname">'+esc(j.name)+'</div>'
      + '<div class="pairs">'+pair('Гэрээний баланс', j.contract-s)+pair('Орлогын баланс', ib)+'</div>'
      + '<div class="sub" style="margin-top:10px">Дууссан '+(j.doneDate||'')
      + ' · Гэрээ '+fmt(j.contract)+' · Орлого '+fmt(earned(j))+' · Зардал '+fmt(s)+'</div></button>';
  });
  return h;
}

    written(j).forEach(e => gone.push({e, j}));
  });
  live.sort((a,b)=> a.e.date<b.e.date?1:-1);
  gone.sort((a,b)=> a.e.date<b.e.date?1:-1);
  const total = live.reduce((s,x)=>s+x.e.amount,0);

  let h = '<button class="link" onclick="view=\'list\';render()">← Буцах</button>'
    + '<div class="total"><span>Ашиглагдаж буй хөрөнгө</span><b>'+fmt(total)+'</b></div>';

  if(live.length===0){
    h += '<div class="note">Үндсэн хөрөнгө бүртгээгүй байна. Зардал нэмэхдээ "Үндсэн хөрөнгө болж үлдэнэ" гэдгийг тэмдэглээрэй.</div>';
  } else {
    live.forEach(x => {
      h += '<div class="row asset"><div style="min-width:0">'
        + '<div class="rdesc">'+esc(x.e.desc)+'</div>'
        + '<div class="jobtag">'+esc(x.j.name)+' · '+x.e.date+'</div></div>'
        + '<div style="display:flex;align-items:center;gap:9px">'
        + '<span class="ramt">'+fmt(x.e.amount)+'</span>'
        + '<button class="small warn" onclick="ui={off:\''+x.e.id+'\'};render()">Хасах</button>'
        + '</div></div>'
        + (ui.off === x.e.id ? '<div class="inf">'
            + '<input id="offNote" placeholder="Шалтгаан (гэмтсэн, эвдэрсэн, алдагдсан)" value="Гэмтсэн">'
            + '<div class="btns"><button class="btn" onclick="writeOff(\''+x.j.id+'\',\''+x.e.id+'\')">Хасах</button>'
            + '<button class="btn ghost" onclick="ui={};render()">Болих</button></div></div>' : '');
    });
  }

  if(gone.length>0){
    const lost = gone.reduce((s,x)=>s+x.e.amount,0);
    h += '<div class="secttl">Хасагдсан — '+fmt(lost)+'</div>';
    gone.forEach(x => {
      h += '<div class="row asset off"><div style="min-width:0">'
        + '<div class="rdesc">'+esc(x.e.desc)+'</div>'
        + '<div class="jobtag">'+esc(x.j.name)+' · '+(x.e.offDate||x.e.date)
        + (x.e.offNote ? ' · '+esc(x.e.offNote) : '')+'</div></div>'
        + '<div style="display:flex;align-items:center;gap:9px">'
        + '<span class="ramt">'+fmt(x.e.amount)+'</span>'
        + '<button class="small" onclick="restoreAsset(\''+x.j.id+'\',\''+x.e.id+'\')">Буцаах</button>'
        + '</div></div>';
    });
  }
  return h;
}

function writeOff(jid, eid){
  const j = jobs.find(x=>x.id===jid); if(!j) return;
  const e = j.expenses.find(x=>x.id===eid); if(!e) return;
  const el = document.getElementById('offNote');
  e.writtenOff = true;
  e.offNote = el ? el.value.trim() : 'Гэмтсэн';
  ui = {};
  e.offDate = today();
  save(); render();
}

function restoreAsset(jid, eid){
  const j = jobs.find(x=>x.id===jid); if(!j) return;
  const e = j.expenses.find(x=>x.id===eid); if(!e) return;
  delete e.writtenOff; delete e.offNote; delete e.offDate;
  save(); render();
}

function memberBox(j){
  const owner = !j.owner || j.owner === me;
  const ms = j.members || [];
  let h = '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">'
    + '<div class="mlabel" style="margin-bottom:7px">Хандах эрхтэй хүмүүс</div>';
  ms.forEach(m => {
    h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0">'
      + '<span style="font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(m)
      + (m === j.owner ? ' <span style="color:var(--muted);font-size:12px">· эзэн</span>' : '')+'</span>'
      + (owner && m !== j.owner
          ? '<button class="x" onclick="delMember(\''+esc(m)+'\')">×</button>' : '')+'</div>';
  });
  if(owner){
    if(ui.mAdd){
      h += '<div class="inf" style="margin-top:8px">'
        + '<input id="memEmail" type="email" inputmode="email" placeholder="Инженерийн имэйл">'
        + '<div class="btns"><button class="btn" onclick="addMember()">Нэмэх</button>'
        + '<button class="btn ghost" onclick="ui={};render()">Болих</button></div></div>';
    } else {
      h += '<button class="small" style="margin-top:8px" onclick="ui={mAdd:1};render()">+ Хүн нэмэх</button>';
    }
    h += '<div class="rdate" style="margin-top:8px">Нэмсэн хүн энэ ажлыг өөрийн утсан дээрээ харж, '
      + 'зардал, ирц оруулна. Тухайн хүн эхлээд аппд ижил имэйлээр бүртгүүлсэн байх ёстой.</div>';
  }
  return h + '</div>';
}

function addMember(){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const em = document.getElementById('memEmail').value.trim().toLowerCase();
  if(!em || em.indexOf('@') < 0){ alert('Имэйл буруу байна.'); return; }
  j.members = j.members || [];
  if(!j.members.includes(em)) j.members.push(em);
  save(); ui={}; render();
}

function delMember(em){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  j.members = (j.members||[]).filter(m => m !== em);
  save(); render();
}

function toggleDone(){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  if(j.done){ delete j.done; delete j.doneDate; }
  else { j.done = true; j.doneDate = today(); }
  save(); render();
}

function openJob(id){ openId=id; tab='exp'; editContract=false; ui={}; pickOpen=false; render(); }

function addJob(){
  const name = document.getElementById('nName').value.trim();
  const c = num(document.getElementById('nContract').value);
  if(!name || !(c>0)){ alert('Ажлын нэр болон гэрээний дүнг оруулна уу.'); return; }
  jobs.unshift({id:uid(), name, contract:c, type:newType, owner:me, members:[me], createdAt:Date.now(),
    incomes:[], expenses:[], labor:[], workers:[], wagePays:[], bonuses:[]});
  newJob=false; save(); render();
}

function addEntry(){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const a = num(document.getElementById('eAmt').value);
  if(!(a>0)){ alert('Дүнг оруулна уу.'); return; }
  const chk = document.getElementById('eAsset');
  const entry = {
    id: uid(),
    desc: document.getElementById('eDesc').value.trim() || (tab==='exp'?'Зардал':'Орлого'),
    amount: a,
    date: document.getElementById('eDate').value || today(),
    asset: tab==='exp' && chk && chk.checked,
    cat: tab==='exp' ? selCat : undefined
  };
  (tab==='exp'? j.expenses : j.incomes).push(entry);
  save(); render();
}

function pickCat(el, k){
  selCat = k;
  el.parentNode.querySelectorAll('.chip').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
}

function setCat(eid, k){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const e = j.expenses.find(x=>x.id===eid); if(!e) return;
  e.cat = k; save(); render();
}

function setProgress(v){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  j.progress = Math.max(0, Math.min(100, parseInt(v,10)||0));
  save(); render();
}

function addAttend(){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const wid = document.getElementById('lWorker').value;
  const d = parseFloat(String(document.getElementById('lDays').value).replace(',','.'));
  if(!(d>0)){ alert('Өдрийн тоог оруулна уу.'); return; }
  j.labor = j.labor || [];
  j.labor.push({id: uid(), workerId: wid, people: d,
    date: document.getElementById('eDate').value || today()});
  save(); render();
}

function addWorker(){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const name = document.getElementById('waName').value.trim();
  const r = num(document.getElementById('waRate').value) || 0;
  if(!name){ alert('Нэрээ оруулна уу.'); return; }
  j.workers = j.workers || [];
  const role = document.getElementById('waRole').value.trim();
  const rid = rosterAdd(name, r, role);
  j.workers.push({id: uid(), rid, name, rate: r, role});
  save(); ui={}; render();
}

function saveWorkerEdit(wid){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const w = (j.workers||[]).find(x=>x.id===wid); if(!w) return;
  const name = document.getElementById('weName').value.trim();
  const r = num(document.getElementById('weRate').value);
  if(name) w.name = name;
  if(r>=0) w.rate = r;
  w.role = document.getElementById('weRole').value.trim();
  save(); ui={}; render();
}

function delWorker(wid){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  j.workers = (j.workers||[]).filter(x=>x.id!==wid);
  j.labor = (j.labor||[]).filter(e=>e.workerId!==wid);
  save(); ui={}; render();
}

function payWage(wid){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const w = (j.workers||[]).find(x=>x.id===wid); if(!w) return;
  const d = parseFloat(String(document.getElementById('payDays').value).replace(',','.'));
  if(!(d>0)){ alert('Өдрийн тоог оруулна уу.'); return; }
  const dt = document.getElementById('payDate').value || today();
  const amount = d * w.rate;
  const eid = uid();
  j.wagePays = j.wagePays || [];
  j.wagePays.push({id: uid(), workerId: wid, days: d, amount, date: dt, expenseId: eid});
  j.expenses.push({id: eid, desc: 'Цалин — '+w.name+' ('+nd(d)+' өдөр)', amount,
    date: dt, cat: 'wage', asset: false});
  save(); ui={}; render();
}

function payBonus(wid){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const w = (j.workers||[]).find(x=>x.id===wid); if(!w) return;
  const a = num(document.getElementById('bonAmt').value);
  if(!(a>0)){ alert('Дүнг оруулна уу.'); return; }
  const note = document.getElementById('bonNote').value.trim();
  const dt = document.getElementById('bonDate').value || today();
  const eid = uid();
  j.bonuses = j.bonuses || [];
  j.bonuses.push({id: uid(), workerId: wid, amount: a, note, date: dt, expenseId: eid});
  j.expenses.push({id: eid, desc: 'Урамшуулал — '+w.name+(note?' ('+note+')':''), amount: a,
    date: dt, cat: 'wage', asset: false});
  save(); ui={}; render();
}

function delLabor(lid){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  j.labor = (j.labor||[]).filter(x=>x.id!==lid);
  save(); render();
}

function delEntry(eid){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  if(tab==='exp'){
    j.expenses = j.expenses.filter(e=>e.id!==eid);
    j.wagePays = (j.wagePays||[]).filter(p=>p.expenseId!==eid);
    j.bonuses = (j.bonuses||[]).filter(b=>b.expenseId!==eid);
  }
  else j.incomes = j.incomes.filter(e=>e.id!==eid);
  save(); render();
}

function saveContract(){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  const c = num(document.getElementById('cEdit').value);
  if(c>=0) j.contract = c;
  editContract=false; save(); render();
}

function delJob(){
  const j = jobs.find(x=>x.id===openId); if(!j) return;
  jobs = jobs.filter(x=>x.id!==openId); openId=null;
  if(view==='done' && jobs.filter(x=>x.done).length===0) view='list';
  save(); render();
}

function exportData(){
  const txt = JSON.stringify({jobs, roster});
  navigator.clipboard.writeText(txt).then(
    ()=>alert('Өгөгдөл хуулагдлаа. Тэмдэглэлдээ хадгалаарай.'),
    ()=>{ ui = {exp: txt}; render(); }
  );
}

function importData(){
  const el = document.getElementById('impBox');
  if(!el){ ui = {imp:1}; render(); return; }
  const txt = el.value.trim();
  if(!txt) return;
  try{
    const parsed = JSON.parse(txt);
    const d = Array.isArray(parsed) ? parsed : parsed.jobs;
    if(!Array.isArray(d)) throw 0;
    if(parsed && parsed.roster){ roster = parsed.roster; saveRoster(); }
    load2(d); save(); ui={}; render();
  }catch(e){ alert('Өгөгдөл буруу байна.'); }
}
function load2(d){
  jobs = d.map(j=>({owner: me, members: [me], createdAt: Date.now(), ...j, contract:j.contract ?? j.budget ?? 0, incomes:j.incomes||[], labor:j.labor||[], workers:j.workers||[], wagePays:j.wagePays||[], bonuses:j.bonuses||[],
    expenses:(j.expenses||[]).map(e=>({...e, asset: !!e.asset})),
    members: (j.members && j.members.length) ? j.members : [me],
    owner: j.owner || me}));
}

function boot(){
  const F = window.FB;
  F.onAuthStateChanged(F.auth, u => {
    me = u ? (u.email||'').toLowerCase() : null;
    jobs = []; roster = []; shadow = {}; rshadow = {};
    booted = !me; ui = {}; openId = null; view = 'list';
    if(me){ try{ localStorage.setItem('last-email', me); }catch(e){} subscribe(); }
    render();
  });
}
try{ ui.lastEmail = localStorage.getItem('last-email')||''; }catch(e){}
render();
if(window.FB) boot(); else window.addEventListener('fb-ready', boot);
document.addEventListener('focusout', () => {
  if(pendingRender) setTimeout(() => { if(pendingRender){ pendingRender = false; render(); } }, 120);
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
